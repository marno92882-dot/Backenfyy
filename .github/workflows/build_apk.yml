name: InterShare - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter"
        required: true
        type: string

      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

jobs:
  build:
    name: Build InterShare APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.47.1"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================

      - name: Verify Owner
        shell: bash
        env:
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -euo pipefail

          if [ -z "$OWNER_ID" ]; then
            echo "❌ OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi

          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized."
            exit 1
          fi

          echo "✅ Owner verified."


      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 4. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true


      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android
        uses: android-actions/setup-android@v3


      # ============================================================
      # 6. TOOLS
      # ============================================================

      - name: Install Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            curl \
            file \
            python3 \
            xmlstarlet

          echo "✅ Tools installed."


      # ============================================================
      # 7. ENVIRONMENT
      # ============================================================

      - name: Show Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INTERSHARE BUILD ENVIRONMENT"
          echo "=============================================="

          flutter --version
          dart --version
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"


      # ============================================================
      # 8. DOWNLOAD ZIP
      # ============================================================

      - name: Download Project ZIP
        shell: bash
        env:
          ZIP_URL_INPUT: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail

          ZIP_URL="$ZIP_URL_INPUT"

          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi

          # GitHub blob -> raw
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi

          echo "📥 Downloading project ZIP..."

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            --output project.zip

          if [ ! -s project.zip ]; then
            echo "❌ ZIP kosong."
            exit 1
          fi

          echo "✅ ZIP downloaded."

          ls -lh project.zip


      # ============================================================
      # 9. EXTRACT
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf flutter_project

          mkdir -p flutter_project

          unzip -q project.zip -d flutter_project

          echo "✅ ZIP extracted."


      # ============================================================
      # 10. FIND PUBSPEC
      # ============================================================

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(
            find "$GITHUB_WORKSPACE/flutter_project" \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "PROJECT"
          echo "=============================================="
          echo "$PROJECT_DIR"


      # ============================================================
      # 11. CHECK ANDROID
      # ============================================================

      - name: Check Android Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "❌ Folder android tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" ]; then
            echo "❌ AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          echo "✅ Android project detected."


      # ============================================================
      # 12. SHOW ORIGINAL GRADLE CONFIG
      # ============================================================

      - name: Inspect Original Android Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ORIGINAL ANDROID CONFIG"
          echo "=============================================="

          echo ""
          echo "--- settings.gradle ---"

          if [ -f "$PROJECT_DIR/android/settings.gradle" ]; then
            sed -n '1,240p' "$PROJECT_DIR/android/settings.gradle"
          fi

          echo ""
          echo "--- settings.gradle.kts ---"

          if [ -f "$PROJECT_DIR/android/settings.gradle.kts" ]; then
            sed -n '1,240p' "$PROJECT_DIR/android/settings.gradle.kts"
          fi

          echo ""
          echo "--- build.gradle ---"

          if [ -f "$PROJECT_DIR/android/build.gradle" ]; then
            sed -n '1,260p' "$PROJECT_DIR/android/build.gradle"
          fi

          echo ""
          echo "--- build.gradle.kts ---"

          if [ -f "$PROJECT_DIR/android/build.gradle.kts" ]; then
            sed -n '1,260p' "$PROJECT_DIR/android/build.gradle.kts"
          fi

          echo ""
          echo "--- app/build.gradle ---"

          if [ -f "$PROJECT_DIR/android/app/build.gradle" ]; then
            sed -n '1,320p' "$PROJECT_DIR/android/app/build.gradle"
          fi

          echo ""
          echo "--- app/build.gradle.kts ---"

          if [ -f "$PROJECT_DIR/android/app/build.gradle.kts" ]; then
            sed -n '1,320p' "$PROJECT_DIR/android/app/build.gradle.kts"
          fi


      # ============================================================
      # 13. REMOVE BROKEN KOTLIN PLUGIN CONFIG
      # ============================================================

      - name: Normalize Kotlin Configuration
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"

          echo "=============================================="
          echo "NORMALIZING KOTLIN CONFIGURATION"
          echo "=============================================="

          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------

          if [ -f "$ANDROID_DIR/settings.gradle" ]; then

            python3 - "$ANDROID_DIR/settings.gradle" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove Kotlin plugin declarations from plugins block.
          text = re.sub(
              r'(?m)^[ \t]*id[ \t]*[\'"]org\.jetbrains\.kotlin\.android[\'"][^\n]*\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*id[ \t]*[\'"]org\.jetbrains\.kotlin\.jvm[\'"][^\n]*\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*id[ \t]*[\'"]org\.jetbrains\.kotlin[\'"][^\n]*\n?',
              '',
              text
          )

          # Remove kotlin plugin from pluginManagement repositories
          # only if it is explicitly configured as a special repository.
          text = text.replace(
              'id "org.jetbrains.kotlin.android"',
              ''
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ settings.gradle normalized.")
          PY

          fi


          # --------------------------------------------------------
          # settings.gradle.kts
          # --------------------------------------------------------

          if [ -f "$ANDROID_DIR/settings.gradle.kts" ]; then

            python3 - "$ANDROID_DIR/settings.gradle.kts" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'(?m)^[ \t]*id\s*\(\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)[^\n]*\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*id\s*\(\s*["\']org\.jetbrains\.kotlin\.jvm["\']\s*\)[^\n]*\n?',
              '',
              text
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ settings.gradle.kts normalized.")
          PY

          fi


      # ============================================================
      # 14. FORCE SAFE GRADLE REPOSITORIES
      # ============================================================

      - name: Configure Gradle Repositories
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"

          echo "=============================================="
          echo "CONFIGURING GRADLE REPOSITORIES"
          echo "=============================================="

          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------

          if [ -f "$ANDROID_DIR/settings.gradle" ]; then

            python3 - "$ANDROID_DIR/settings.gradle" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          header = r'''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
              }
          }

          '''

          # Remove existing pluginManagement block.
          def remove_block(text, keyword):
              start = text.find(keyword)
              if start == -1:
                  return text

              brace = text.find("{", start)

              if brace == -1:
                  return text

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  return text

              return text[:start] + text[end:]

          text = remove_block(text, "pluginManagement")

          # Remove dependencyResolutionManagement.
          text = remove_block(text, "dependencyResolutionManagement")

          # Remove imports because settings.gradle normally has
          # no import for RepositoriesMode.
          if "RepositoriesMode" in text:
              text = "import org.gradle.api.initialization.resolve.RepositoriesMode\n" + text

          text = header + text.lstrip()

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ settings.gradle repositories configured.")
          PY

          fi


      # ============================================================
      # 15. FORCE FLUTTER PLUGIN LOADER
      # ============================================================

      - name: Normalize Flutter Settings
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/android/settings.gradle"

          if [ -f "$SETTINGS" ]; then

            if ! grep -q "dev.flutter.flutter-plugin-loader" "$SETTINGS"; then

              cat > "$SETTINGS" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.6.1" apply false
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
              }
          }

          rootProject.name = "intershare"

          def localPropertiesFile = new File(rootDir, "local.properties")

          if (!localPropertiesFile.exists()) {
              localPropertiesFile.createNewFile()
          }

          def localProperties = new Properties()

          localPropertiesFile.withReader("UTF-8") { reader ->
              localProperties.load(reader)
          }

          def flutterSdkPath = localProperties.getProperty("flutter.sdk")

          if (flutterSdkPath == null) {
              throw new GradleException(
                  "flutter.sdk not set in local.properties"
              )
          }

          include ":app"

          apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
          EOF

              echo "✅ Flutter settings regenerated."

            else

              echo "✅ Flutter plugin loader already exists."

            fi

          fi


      # ============================================================
      # 16. CREATE SAFE ROOT BUILD.GRADLE
      # ============================================================

      - name: Normalize Root Gradle
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"

          cat > "$ANDROID_DIR/build.gradle" <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url "https://storage.googleapis.com/download.flutter.io"
                  }
              }
          }

          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          echo "✅ Root build.gradle normalized."


      # ============================================================
      # 17. NORMALIZE APP GRADLE
      # ============================================================

      - name: Normalize App Gradle
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "❌ android/app/build.gradle tidak ditemukan."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # --------------------------------------------------------
          # Remove old Kotlin Gradle plugin.
          # This is the source of:
          #
          # ApplicationExtensionImpl cannot be cast to BaseExtension
          # --------------------------------------------------------

          text = re.sub(
              r'(?m)^[ \t]*apply[ \t]+plugin:[ \t]*["\']kotlin-android["\'][^\n]*\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*apply[ \t]+plugin:[ \t]*["\']org\.jetbrains\.kotlin\.android["\'][^\n]*\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*id[ \t]*["\']org\.jetbrains\.kotlin\.android["\'][^\n]*\n?',
              '',
              text
          )

          # --------------------------------------------------------
          # Remove kotlin stdlib dependencies.
          # --------------------------------------------------------

          text = re.sub(
              r'(?m)^[ \t]*(implementation|api|compileOnly|runtimeOnly)[ \t]*[\'"]org\.jetbrains\.kotlin:kotlin-stdlib[^\'"]*[\'"][^\n]*\n?',
              '',
              text
          )

          # --------------------------------------------------------
          # Disable R8/minify.
          #
          # This avoids Play Core missing-class failures for projects
          # that do not use deferred components.
          # --------------------------------------------------------

          text = re.sub(
              r'minifyEnabled\s+true',
              'minifyEnabled false',
              text
          )

          text = re.sub(
              r'shrinkResources\s+true',
              'shrinkResources false',
              text
          )

          # --------------------------------------------------------
          # Ensure repositories.
          # --------------------------------------------------------

          if "maven { url" not in text:
              text = """
          repositories {
              google()
              mavenCentral()
              maven {
                  url "https://storage.googleapis.com/download.flutter.io"
              }
          }

          """ + text

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ app/build.gradle normalized.")
          PY


      # ============================================================
      # 18. ENSURE ANDROID MANIFEST
      # ============================================================

      - name: Fix Flutter Android Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          try:
              tree = ET.parse(path)
          except Exception as e:
              print("❌ AndroidManifest.xml invalid:")
              print(e)
              sys.exit(1)

          root = tree.getroot()

          application = root.find("application")

          if application is None:
              print("❌ <application> tidak ditemukan.")
              sys.exit(1)

          found = False

          for child in application:

              if child.tag == "meta-data":

                  name = child.attrib.get(
                      f"{{{ANDROID}}}name"
                  )

                  if name == "flutterEmbedding":

                      child.set(
                          f"{{{ANDROID}}}value",
                          "2"
                      )

                      found = True

          if not found:

              metadata = ET.Element("meta-data")

              metadata.set(
                  f"{{{ANDROID}}}name",
                  "flutterEmbedding"
              )

              metadata.set(
                  f"{{{ANDROID}}}value",
                  "2"
              )

              application.insert(0, metadata)

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("✅ Flutter Android Embedding V2 configured.")
          PY


      # ============================================================
      # 19. VERIFY EMBEDDING
      # ============================================================

      - name: Verify Flutter Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'flutterEmbedding' "$MANIFEST"; then
            echo "❌ flutterEmbedding metadata tidak ditemukan."
            exit 1
          fi

          if ! grep -q 'value="2"' "$MANIFEST"; then
            echo "❌ Flutter Embedding V2 tidak aktif."
            exit 1
          fi

          echo "✅ Flutter Embedding V2 verified."


      # ============================================================
      # 20. GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
              echo "⚠️ gradlew tidak ditemukan."
          else
              chmod +x gradlew
              echo "✅ gradlew executable."
          fi


      # ============================================================
      # 21. NORMALIZE GRADLE VERSION
      # ============================================================

      - name: Normalize Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "❌ gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          python3 - "$WRAPPER" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          out = []

          for line in lines:

              if line.startswith("distributionUrl="):

                  line = (
                      "distributionUrl="
                      "https\\://services.gradle.org/distributions/"
                      "gradle-8.7-bin.zip\n"
                  )

              out.append(line)

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(out)

          print("✅ Gradle wrapper set to 8.7.")
          PY


      # ============================================================
      # 22. REMOVE OLD GRADLE CACHE
      # ============================================================

      - name: Clean Android Build Cache
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf \
            .dart_tool \
            build \
            android/.gradle \
            android/app/build

          echo "✅ Old build caches removed."


      # ============================================================
      # 23. FLUTTER CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

          echo "✅ Flutter clean complete."


      # ============================================================
      # 24. PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "RESOLVING FLUTTER DEPENDENCIES"
          echo "=============================================="

          flutter pub get

          echo "✅ Dependencies resolved."


      # ============================================================
      # 25. FLUTTER DOCTOR
      # ============================================================

      - name: Flutter Doctor
        shell: bash
        run: |
          set -euo pipefail

          flutter doctor -v


      # ============================================================
      # 26. GRADLE REPOSITORY CHECK
      # ============================================================

      - name: Check Gradle Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "=============================================="
          echo "GRADLE CONFIGURATION"
          echo "=============================================="

          ./gradlew --version

          echo ""
          echo "Repositories:"
          grep -R "google()" -n . --include="*.gradle" --include="*.gradle.kts" || true
          grep -R "mavenCentral()" -n . --include="*.gradle" --include="*.gradle.kts" || true


      # ============================================================
      # 27. BUILD
      # ============================================================

      - name: Build InterShare APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo ""
          echo "=============================================="
          echo "        INTERSHARE APK RELEASE BUILD"
          echo "=============================================="
          echo ""

          flutter build apk \
            --release \
            --no-tree-shake-icons

          echo ""
          echo "=============================================="
          echo "             BUILD SUCCESS"
          echo "=============================================="


      # ============================================================
      # 28. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK_PATH="$DEFAULT_APK"

          else

            APK_PATH="$(
              find "$PROJECT_DIR/build" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"

          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_MB=$APK_MB" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="

          echo "Path: $APK_PATH"
          echo "Size: ${APK_MB} MB"


      # ============================================================
      # 29. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InterShare-release
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error


      # ============================================================
      # 30. TELEGRAM MESSAGE
      # ============================================================

      - name: Send Telegram Result
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          MESSAGE="🎉 InterShare APK berhasil dibuat!

          📱 InterShare
          📦 com.intershare.marnommk
          🔢 Version: 1.0.0+1
          📏 Size: ${APK_MB} MB

          ✅ Release build berhasil."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo "✅ Telegram success message sent."


      # ============================================================
      # 31. SEND APK
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 InterShare Release APK"

          echo "✅ APK sent to Telegram."


      # ============================================================
      # 32. FAILURE NOTIFICATION
      # ============================================================

      - name: Send Build Failure
        if: failure()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=❌ InterShare APK build gagal. Cek log GitHub Actions."

          echo "❌ Failure notification sent."
