name: freevpsmarno

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    name: FREE VPS MARNO

    steps:
      - name: Setup hostname
        run: |
          echo "freevpsmarno" | sudo tee /etc/hostname
          sudo hostnamectl set-hostname freevpsmarno
          sudo sed -i 's/127.0.1.1.*/127.0.1.1 freevpsmarno/' /etc/hosts

          sudo bash -c 'cat > /root/.bashrc <<EOF
          export PS1="\\u@freevpsmarno:\\w# "
          EOF'

      - name: Detect VPS Specs & Region
        run: |
          VPS_CITY=$(curl -fsSL https://ipinfo.io/city || echo "Unknown")
          VPS_REGION=$(curl -fsSL https://ipinfo.io/region || echo "Unknown")
          VPS_COUNTRY=$(curl -fsSL https://ipinfo.io/country || echo "Unknown")
          VPS_ORG=$(curl -fsSL https://ipinfo.io/org || echo "Unknown")
          VPS_CPU_MODEL=$(lscpu | grep "Model name" | sed 's/Model name:[[:space:]]*//' | head -1)
          VPS_CPU_CORES=$(nproc)
          VPS_RAM=$(free -h | awk '/^Mem:/ {print $2}')
          VPS_OS=$(lsb_release -ds 2>/dev/null || grep PRETTY_NAME /etc/os-release | cut -d '"' -f2)
          VPS_HOSTNAME=$(hostname)

          echo "===== VPS INFO ====="
          echo "Hostname : $VPS_HOSTNAME"
          echo "CPU      : $VPS_CPU_MODEL"
          echo "Cores    : $VPS_CPU_CORES"
          echo "RAM      : $VPS_RAM"
          echo "OS       : $VPS_OS"
          echo "Region   : $VPS_CITY, $VPS_REGION, $VPS_COUNTRY"
          echo "Provider : $VPS_ORG"

      - name: Install Cloudflare & ttyd
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget lsb-release

          # Install ttyd
          sudo apt-get install -y ttyd

          # Install cloudflared
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared --version
          ttyd --version

      - name: Start Web Terminal
        run: |
          sudo nohup ttyd \
            --port 7681 \
            --interface 127.0.0.1 \
            bash \
            >/tmp/ttyd.log 2>&1 &

          sleep 3

          if ! curl -fsS http://127.0.0.1:7681 >/dev/null; then
            echo "ttyd gagal dijalankan"
            cat /tmp/ttyd.log
            exit 1
          fi

          echo "ttyd berhasil berjalan di port 7681"

      - name: Start Cloudflare Quick Tunnel
        run: |
          sudo nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:7681 \
            >/tmp/cloudflared.log 2>&1 &

          echo "Menunggu URL Cloudflare..."

          for i in $(seq 1 30); do
            CLOUDFLARE_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)

            if [ -n "$CLOUDFLARE_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$CLOUDFLARE_URL" ]; then
            echo "URL Cloudflare tidak ditemukan."
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo ""
          echo "========================================="
          echo " CLOUDFLARE QUICK TUNNEL"
          echo "========================================="
          echo "$CLOUDFLARE_URL"
          echo "========================================="

          VPS_CITY=$(curl -fsSL https://ipinfo.io/city || echo "Unknown")
          VPS_REGION=$(curl -fsSL https://ipinfo.io/region || echo "Unknown")
          VPS_COUNTRY=$(curl -fsSL https://ipinfo.io/country || echo "Unknown")
          VPS_CPU_CORES=$(nproc)
          VPS_RAM=$(free -h | awk '/^Mem:/ {print $2}')
          VPS_OS=$(lsb_release -ds 2>/dev/null || grep PRETTY_NAME /etc/os-release | cut -d '"' -f2)
          VPS_HOSTNAME=$(hostname)

          # Masukkan token bot baru di sini, atau lebih aman gunakan
          # GitHub Actions Secret.
          BOT_TOKEN="8842721589:AAGCvfDmLZ0HPla2307gYr6zZo67r3dgKAs"
          CHAT_ID="7487656311"

          MESSAGE=$(printf '%s\n' \
            "✅ Sukses create VPS" \
            "" \
            "ʙᴇʀɪᴋᴜᴛ ᴅᴇᴛᴀɪʟ Vᴘꜱ:" \
            "" \
            "🖥️ Hostname: $VPS_HOSTNAME" \
            "⏰ Masa Aktif: 7 Jam" \
            "📦 Spec: RAM $VPS_RAM | Core $VPS_CPU_CORES" \
            "💿 OS: $VPS_OS" \
            "🌍 Region: $VPS_CITY, $VPS_REGION, $VPS_COUNTRY" \
            "" \
            "🌐 ʟᴏɢɪɴ ᴡᴇʙ ᴛᴇʀᴍɪɴᴀʟ:" \
            "$CLOUDFLARE_URL" \
            "" \
            "⚠️ 𝗧.𝗢.𝗦 𝗩𝗣𝗦:" \
            "• ɴᴏ ʜᴀᴄᴋɪɴɢ" \
            "• ɴᴏ ᴍɪɴɪɴɢ" \
            "• ɴᴏ ᴛᴏʀʀᴇɴᴛ" \
            "• ɴᴏ ᴏᴠᴇʀʟᴏᴀᴅ (100%% ᴄᴘᴜ)" \
            "• ɴᴏ ᴅᴅᴏs" \
            "• ɴᴏ ᴀᴋᴛɪᴠɪᴛᴀs ɪʟᴇɢᴀʟ" \
            "" \
            "Dev By Marno")

          curl -fsS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Keep VPS alive
        run: |
          echo "🔥 VPS akan tetap berjalan sampai GitHub menghentikan runner."

          while true; do
            sleep 300

            if ! pgrep -x cloudflared >/dev/null; then
              echo "Cloudflared berhenti. Menjalankan ulang..."

              nohup cloudflared tunnel \
                --no-autoupdate \
                --url http://127.0.0.1:7681 \
                >/tmp/cloudflared.log 2>&1 &
            fi
          done
