name: InterShare - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct/raw download URL file ZIP"
        required: true
        type: string

      chat_id:
        description: "Chat ID Telegram owner"
        required: true
        type: string

jobs:
  build:
    name: Build InterShare APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.47.0"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================

      - name: Verify Owner
        shell: bash
        env:
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -e

          if [ -z "$OWNER_ID" ]; then
            echo "❌ OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi

          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized."
            exit 1
          fi

          echo "✅ Owner verified."

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "✅ Android SDK 36 ready."

      # ============================================================
      # 6. INSTALL ZIP TOOLS
      # ============================================================

      - name: Install ZIP tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip curl file

          echo "✅ ZIP tools installed."

      # ============================================================
      # 7. DOWNLOAD ZIP
      # ============================================================

      - name: Download InterShare ZIP
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi

          # Convert GitHub blob URL to raw URL
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi

          echo "📥 Downloading ZIP..."

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            --output project.zip

          if [ ! -s project.zip ]; then
            echo "❌ project.zip kosong."
            exit 1
          fi

          echo "📦 ZIP size:"
          du -h project.zip

          echo "✅ ZIP downloaded."

      # ============================================================
      # 8. EXTRACT ZIP
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf flutter_project
          mkdir -p flutter_project

          unzip -q project.zip -d flutter_project

          echo "✅ Project extracted."

      # ============================================================
      # 9. DETECT FLUTTER PROJECT
      # ============================================================

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -e

          PUBSPEC="$(
            find "$GITHUB_WORKSPACE/flutter_project" \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "📁 Flutter project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 10. FIX FLUTTER ANDROID EMBEDDING V2
      # ============================================================

      - name: Fix Flutter Android Embedding
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          echo "Checking Flutter Android embedding..."

          if grep -q 'android:name="flutterEmbedding"' "$MANIFEST"; then
            echo "✅ Flutter embedding metadata sudah ada."
          else
            sed -i '/<application/a\
                <meta-data android:name="flutterEmbedding" android:value="2" />' "$MANIFEST"

            echo "✅ Flutter embedding V2 metadata ditambahkan."
          fi

          echo
          echo "===== FLUTTER EMBEDDING ====="

          grep -n "flutterEmbedding" "$MANIFEST" || true

      # ============================================================
      # 11. ENSURE ANDROIDX
      # ============================================================

      - name: Ensure AndroidX
        shell: bash
        run: |
          set -e

          GRADLE_PROPERTIES="$PROJECT_DIR/android/gradle.properties"

          mkdir -p "$PROJECT_DIR/android"
          touch "$GRADLE_PROPERTIES"

          if ! grep -q "^android.useAndroidX=true" "$GRADLE_PROPERTIES"; then
            echo "android.useAndroidX=true" >> "$GRADLE_PROPERTIES"
          fi

          if ! grep -q "^android.enableJetifier=true" "$GRADLE_PROPERTIES"; then
            echo "android.enableJetifier=true" >> "$GRADLE_PROPERTIES"
          fi

          echo "✅ AndroidX configured."

      # ============================================================
      # 12. FIX GRADLE WRAPPER PERMISSION
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/android/gradlew" ]; then
            chmod +x "$PROJECT_DIR/android/gradlew"
          fi

          echo "✅ Gradle prepared."

      # ============================================================
      # 13. FLUTTER PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter pub get

          echo "✅ flutter pub get completed."

      # ============================================================
      # 14. BUILD APK DIRECTLY
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo
          echo "=============================================="
          echo "        INTERSHARE APK RELEASE BUILD"
          echo "=============================================="
          echo

          flutter build apk --release

          echo
          echo "=============================================="
          echo "             BUILD SUCCESS"
          echo "=============================================="
          echo

      # ============================================================
      # 15. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          DEFAULT_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$DEFAULT_APK" ]; then
            APK_PATH="$DEFAULT_APK"
          else
            APK_PATH="$(
              find "$PROJECT_DIR/build" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          APK_SIZE="$(stat -c%s "$APK_PATH")"
          APK_MB="$((APK_SIZE / 1024 / 1024))"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK_MB=$APK_MB" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="
          echo "Path : $APK_PATH"
          echo "Size : ${APK_MB} MB"

      # ============================================================
      # 16. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK file tidak ditemukan."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "❌ APK file kosong."
            exit 1
          fi

          file "$APK_PATH"

          echo "✅ APK valid."

      # ============================================================
      # 17. UPLOAD APK ARTIFACT
      # ============================================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterShare-release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 18. TELEGRAM SUCCESS MESSAGE
      # ============================================================

      - name: Send Telegram Build Result
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -e

          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN belum diset."
            exit 1
          fi

          if [ -z "$OWNER_ID" ]; then
            echo "❌ OWNER_CHAT_ID belum diset."
            exit 1
          fi

          TEXT="🎉 InterShare APK berhasil dibuat!

          📱 App: InterShare
          📦 Package: com.intershare.marnommk
          🔢 Version: 1.0.0+1
          📏 Size: ${APK_MB} MB

          ✅ Release build berhasil."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=${TEXT}"

          echo "✅ Telegram notification sent."

      # ============================================================
      # 19. SEND APK TO TELEGRAM
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -e

          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN belum diset."
            exit 1
          fi

          if [ -z "$OWNER_ID" ]; then
            echo "❌ OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          echo "📤 Sending APK to Telegram..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 InterShare 1.0.0+1 Release APK"

          echo "✅ APK sent to Telegram."

      # ============================================================
      # 20. TELEGRAM FAILURE NOTIFICATION
      # ============================================================

      - name: Send Telegram Build Failure
        if: failure()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -e

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          TEXT="❌ InterShare APK build gagal.

          Repository: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Run: #${{ github.run_number }}

          Silakan cek log GitHub Actions."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=${TEXT}" \
            || true

          echo "⚠️ Failure notification sent."
