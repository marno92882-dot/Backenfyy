name: Telegram Bot - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL file ZIP (raw/direct download link)"
        required: true
        type: string
      chat_id:
        description: "Chat ID Telegram"
        required: true
        type: string

jobs:
  build:
    name: Build APK dari ZIP
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.27.0"
      GRADLE_VERSION: "8.7"
      AGP_VERSION: "8.5.0"

    steps:
      - name: Verify Owner ID
        shell: bash
        run: |
          set -euo pipefail
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          if [ -z "$OWNER_ID" ]; then
            echo "❌ Secret OWNER_CHAT_ID belum diset."
            exit 1
          fi
          if [ -z "$CHAT_ID" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi
          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized!"
            exit 1
          fi
          echo "✅ Owner verified!"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip curl file
          echo "✅ Build tools installed."

      - name: Download ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi
          echo "📥 Downloading ZIP..."
          curl --location --fail --show-error --silent --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 600 "$ZIP_URL" --output project.zip
          if [ ! -s project.zip ]; then
            echo "❌ project.zip kosong."
            exit 1
          fi
          echo "✅ ZIP downloaded."

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf flutter_project
          mkdir -p flutter_project
          unzip -q project.zip -d flutter_project
          echo "✅ Extract complete."

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC="$(find "$GITHUB_WORKSPACE/flutter_project" -type f -name "pubspec.yaml" -not -path "*/.dart_tool/*" -not -path "*/build/*" | head -n 1)"
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Flutter project: $PROJECT_DIR"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ env.PROJECT_DIR }}"
          GRADLE_PROPS="$PROJECT_DIR/android/gradle.properties"
          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "⚠️ Folder android tidak ditemukan. Lewati langkah AndroidX."
            exit 0
          fi
          mkdir -p "$(dirname "$GRADLE_PROPS")"
          touch "$GRADLE_PROPS"
          if ! grep -q "android.useAndroidX" "$GRADLE_PROPS"; then
            echo "android.useAndroidX=true" >> "$GRADLE_PROPS"
          fi
          if ! grep -q "android.enableJetifier" "$GRADLE_PROPS"; then
            echo "android.enableJetifier=true" >> "$GRADLE_PROPS"
          fi
          echo "✅ AndroidX telah diaktifkan."

      - name: Set Stable Gradle & AGP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ env.PROJECT_DIR }}"
          GRADLE_VERSION="${{ env.GRADLE_VERSION }}"
          AGP_VERSION="${{ env.AGP_VERSION }}"
          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "⚠️ Folder android tidak ditemukan."
            exit 0
          fi
          GRADLE_WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_WRAPPER" ]; then
            sed -i "s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-all.zip|" "$GRADLE_WRAPPER"
            echo "✅ Gradle wrapper diubah ke versi ${GRADLE_VERSION}."
          fi
          BUILD_GRADLE="$PROJECT_DIR/android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if grep -q "com.android.tools.build:gradle" "$BUILD_GRADLE"; then
              sed -i "s|com.android.tools.build:gradle:.*|com.android.tools.build:gradle:${AGP_VERSION}|" "$BUILD_GRADLE"
              echo "✅ AGP di build.gradle diubah ke versi ${AGP_VERSION}."
            fi
          fi
          BUILD_GRADLE_KTS="$PROJECT_DIR/android/build.gradle.kts"
          if [ -f "$BUILD_GRADLE_KTS" ]; then
            if grep -q "com.android.tools.build:gradle" "$BUILD_GRADLE_KTS"; then
              sed -i "s|com.android.tools.build:gradle:.*|com.android.tools.build:gradle:${AGP_VERSION}|" "$BUILD_GRADLE_KTS"
              echo "✅ AGP di build.gradle.kts diubah ke versi ${AGP_VERSION}."
            fi
          fi
          echo "✅ Versi Gradle & AGP telah distabilkan."

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get
          echo "✅ Dependencies installed."

      - name: Build APK Release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "=========================================="
          echo "BUILD APK RELEASE"
          echo "=========================================="
          flutter build apk --release
          echo "✅ APK build completed."

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$DEFAULT_APK" ]; then
            APK_PATH="$DEFAULT_APK"
          else
            APK_PATH="$(find "$PROJECT_DIR/build" -type f -name "*.apk" | head -n 1)"
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))
          echo "✅ APK found: ${APK_MB} MB"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: Send Build Result to Telegram
        shell: bash
        run: |
          set -euo pipefail
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN belum diset."
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))
          curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${OWNER_ID}" --data-urlencode "text=✅ Build APK selesai!%0A📦 Ukuran: ${APK_MB} MB"
          echo "✅ Telegram message sent."

      - name: Send APK to Telegram
        shell: bash
        run: |
          set -euo pipefail
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "❌ Telegram credentials belum diset."
            exit 1
          fi
          echo "📤 Sending APK..."
          curl --fail --silent --show-error --retry 3 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" -F "chat_id=${OWNER_ID}" -F "document=@${APK_PATH}" -F "caption=🎉 APK Release"
          echo "✅ APK sent to Telegram."
