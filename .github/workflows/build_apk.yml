name: InterShare - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter"
        required: true
        type: string

      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

jobs:
  build:
    name: Build InterShare APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.47.1"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================

      - name: Verify Owner
        shell: bash
        env:
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -euo pipefail

          if [ -z "${OWNER_ID:-}" ]; then
            echo "❌ OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ -z "${CHAT_ID:-}" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi

          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized."
            exit 1
          fi

          echo "✅ Owner verified."


      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 4. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true


      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android
        uses: android-actions/setup-android@v3


      # ============================================================
      # 6. TOOLS
      # ============================================================

      - name: Install Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            curl \
            file \
            python3 \
            xmlstarlet

          echo "✅ Tools installed."


      # ============================================================
      # 7. ENVIRONMENT
      # ============================================================

      - name: Show Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INTERSHARE BUILD ENVIRONMENT"
          echo "=============================================="

          flutter --version
          dart --version
          java -version

          echo ""
          echo "Flutter:"
          which flutter

          echo ""
          echo "Java:"
          which java


      # ============================================================
      # 8. DOWNLOAD ZIP
      # ============================================================

      - name: Download Project ZIP
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail

          if [ -z "${ZIP_URL:-}" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi

          # GitHub blob -> raw
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi

          echo "📥 Downloading project ZIP..."

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            --output project.zip

          if [ ! -s project.zip ]; then
            echo "❌ ZIP kosong."
            exit 1
          fi

          echo "✅ ZIP downloaded."

          ls -lh project.zip


      # ============================================================
      # 9. EXTRACT
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf flutter_project

          mkdir -p flutter_project

          unzip -q project.zip -d flutter_project

          echo "✅ ZIP extracted."


      # ============================================================
      # 10. FIND PUBSPEC
      # ============================================================

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(
            find "$GITHUB_WORKSPACE/flutter_project" \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "PROJECT:"
          echo "$PROJECT_DIR"
          echo "=============================================="


      # ============================================================
      # 11. CHECK ANDROID
      # ============================================================

      - name: Check Android Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "❌ Folder android tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/android/app/build.gradle.kts" ]; then
            echo "❌ app/build.gradle atau app/build.gradle.kts tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/android/settings.gradle.kts" ]; then
            echo "❌ settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "✅ Android project detected."


      # ============================================================
      # 12. RESET GENERATED / OLD BUILD FILES
      # ============================================================

      - name: Remove Old Build State
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf \
            build \
            .dart_tool \
            android/.gradle \
            android/app/build

          echo "✅ Old build state removed."


      # ============================================================
      # 13. FIX FLUTTER EMBEDDING
      # ============================================================

      - name: Fix Flutter Android Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          try:
              tree = ET.parse(path)
          except Exception as e:
              print("❌ AndroidManifest.xml invalid:")
              print(e)
              sys.exit(1)

          root = tree.getroot()

          application = root.find("application")

          if application is None:
              print("❌ <application> tidak ditemukan.")
              sys.exit(1)

          embedding_name = f"{{{ANDROID}}}name"
          embedding_value = f"{{{ANDROID}}}value"

          found = False

          for child in application:
              if child.tag == "meta-data":

                  name = child.attrib.get(embedding_name)

                  if name == "flutterEmbedding":

                      child.set(
                          embedding_value,
                          "2"
                      )

                      found = True

          if not found:

              metadata = ET.Element("meta-data")

              metadata.set(
                  embedding_name,
                  "flutterEmbedding"
              )

              metadata.set(
                  embedding_value,
                  "2"
              )

              application.insert(0, metadata)

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("✅ Flutter Android Embedding V2 configured.")
          PY


      # ============================================================
      # 14. VERIFY EMBEDDING
      # ============================================================

      - name: Verify Flutter Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'flutterEmbedding' "$MANIFEST"; then
            echo "❌ flutterEmbedding metadata tidak ditemukan."
            exit 1
          fi

          if ! grep -q 'android:value="2"' "$MANIFEST"; then
            echo "❌ Flutter Embedding V2 tidak aktif."
            exit 1
          fi

          echo "✅ Flutter Embedding V2 verified."


      # ============================================================
      # 15. FIX GRADLE REPOSITORIES
      #
      # IMPORTANT:
      # Tidak memindahkan plugins {}.
      # Tidak membuat settings.gradle baru.
      # Hanya memastikan google() + mavenCentral() tersedia.
      # ============================================================

      - name: Fix Gradle Repositories Safely
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/android/settings.gradle"

          if [ ! -f "$SETTINGS" ]; then
            echo "❌ settings.gradle tidak ditemukan."
            exit 1
          fi

          cp "$SETTINGS" "$SETTINGS.backup"

          python3 - "$SETTINGS" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          original = text

          # ----------------------------------------------------------
          # Remove previous bad repository injections generated by
          # earlier workflow attempts.
          # ----------------------------------------------------------

          text = re.sub(
              r'(?m)^[ \t]*repositoriesMode\.set\(.*?\)[ \t]*\n',
              '',
              text
          )

          # ----------------------------------------------------------
          # Find dependencyResolutionManagement block.
          # If it exists, add google() and mavenCentral().
          # ----------------------------------------------------------

          if "dependencyResolutionManagement" in text:

              start = text.find("dependencyResolutionManagement")

              brace_start = text.find("{", start)

              if brace_start != -1:

                  depth = 0
                  end = -1

                  for i in range(brace_start, len(text)):

                      if text[i] == "{":
                          depth += 1

                      elif text[i] == "}":
                          depth -= 1

                          if depth == 0:
                              end = i
                              break

                  if end != -1:

                      block = text[start:end + 1]

                      if "google()" not in block:
                          block = block.replace(
                              "repositories {",
                              "repositories {\n        google()",
                              1
                          )

                      if "mavenCentral()" not in block:
                          block = block.replace(
                              "repositories {",
                              "repositories {\n        mavenCentral()",
                              1
                          )

                      text = text[:start] + block + text[end + 1:]

          # ----------------------------------------------------------
          # If dependencyResolutionManagement does not exist,
          # insert it BEFORE root-level plugin application logic.
          #
          # IMPORTANT:
          # It is inserted near the beginning and NEVER after an
          # arbitrary statement followed by plugins {}.
          # ----------------------------------------------------------

          else:

              management = """dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          """

              # Safe location:
              # after pluginManagement block if one exists,
              # otherwise at beginning.
              if "pluginManagement" in text:

                  pm_start = text.find("pluginManagement")
                  pm_brace = text.find("{", pm_start)

                  if pm_brace != -1:

                      depth = 0
                      pm_end = -1

                      for i in range(pm_brace, len(text)):

                          if text[i] == "{":
                              depth += 1

                          elif text[i] == "}":
                              depth -= 1

                              if depth == 0:
                                  pm_end = i + 1
                                  break

                      if pm_end != -1:
                          text = (
                              text[:pm_end]
                              + "\n\n"
                              + management
                              + text[pm_end:]
                          )

              else:

                  text = management + text

          if text == original:
              print("ℹ️ No repository change required.")
          else:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("✅ Gradle repositories fixed safely.")
          PY

          echo ""
          echo "=============================================="
          echo "SETTINGS.GRADLE"
          echo "=============================================="

          cat "$SETTINGS"


      # ============================================================
      # 16. VALIDATE SETTINGS.GRADLE
      # ============================================================

      - name: Validate Gradle Settings
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew 2>/dev/null || true

          echo "=============================================="
          echo "VALIDATING GRADLE SETTINGS"
          echo "=============================================="

          ./gradlew help \
            --no-daemon \
            --stacktrace

          echo "✅ Gradle settings valid."


      # ============================================================
      # 17. FIX R8
      #
      # Untuk APK release:
      # minify false
      # shrinkResources false
      #
      # Ini menghindari R8 error:
      # com.google.android.play.core.*
      #
      # Kita TIDAK menambahkan keep-rules ke settings.gradle.
      # ============================================================

      - name: Configure Release APK Without R8
        shell: bash
        run: |
          set -euo pipefail

          BUILD_GRADLE="$PROJECT_DIR/android/app/build.gradle"
          BUILD_GRADLE_KTS="$PROJECT_DIR/android/app/build.gradle.kts"

          echo "=============================================="
          echo "CONFIGURE RELEASE APK"
          echo "=============================================="

          if [ -f "$BUILD_GRADLE" ]; then

            cp "$BUILD_GRADLE" "$BUILD_GRADLE.backup"

            python3 - "$BUILD_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # ----------------------------------------------------------
          # Find release { ... } block.
          # ----------------------------------------------------------

          match = re.search(
              r'(?m)^[ \t]*release[ \t]*\{',
              text
          )

          if not match:
              print("⚠️ release {} block tidak ditemukan.")
              print("ℹ️ Menambahkan release block.")

              android_match = re.search(
                  r'(?m)^[ \t]*android[ \t]*\{',
                  text
              )

              if not android_match:
                  print("❌ android {} block tidak ditemukan.")
                  sys.exit(1)

              android_start = android_match.end()

              text = (
                  text[:android_start]
                  + """

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          """
                  + text[android_start:]
              )

          else:

              start = match.start()
              brace = text.find("{", match.start())

              depth = 0
              end = -1

              for i in range(brace, len(text)):

                  if text[i] == "{":
                      depth += 1

                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          end = i
                          break

              if end == -1:
                  print("❌ release {} block tidak valid.")
                  sys.exit(1)

              block = text[brace:end + 1]

              # Remove existing minifyEnabled entries.
              block = re.sub(
                  r'(?m)^[ \t]*minifyEnabled[ \t]+.*$',
                  '',
                  block
              )

              # Remove existing shrinkResources entries.
              block = re.sub(
                  r'(?m)^[ \t]*shrinkResources[ \t]+.*$',
                  '',
                  block
              )

              # Insert deterministic values.
              block = block.replace(
                  "{",
                  """{
                      minifyEnabled false
                      shrinkResources false""",
                  1
              )

              text = text[:brace] + block + text[end + 1:]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ R8/minification disabled for release APK.")
          PY

          elif [ -f "$BUILD_GRADLE_KTS" ]; then

            cp "$BUILD_GRADLE_KTS" "$BUILD_GRADLE_KTS.backup"

            python3 - "$BUILD_GRADLE_KTS" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          match = re.search(
              r'(?m)^[ \t]*release[ \t]*\{',
              text
          )

          if not match:
              print("⚠️ release {} block tidak ditemukan.")
              sys.exit(1)

          brace = text.find("{", match.start())

          depth = 0
          end = -1

          for i in range(brace, len(text)):

              if text[i] == "{":
                  depth += 1

              elif text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i
                      break

          if end == -1:
              print("❌ release {} block invalid.")
              sys.exit(1)

          block = text[brace:end + 1]

          block = re.sub(
              r'(?m)^[ \t]*isMinifyEnabled[ \t]*=.*$',
              '',
              block
          )

          block = re.sub(
              r'(?m)^[ \t]*isShrinkResources[ \t]*=.*$',
              '',
              block
          )

          block = block.replace(
              "{",
              """{
                  isMinifyEnabled = false
                  isShrinkResources = false""",
              1
          )

          text = text[:brace] + block + text[end + 1:]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ R8/minification disabled for release APK.")
          PY

          else
            echo "❌ build.gradle tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "RELEASE CONFIG"
          echo "=============================================="

          grep -n \
            -E "minifyEnabled|shrinkResources|isMinifyEnabled|isShrinkResources" \
            "$PROJECT_DIR/android/app/build.gradle" \
            "$PROJECT_DIR/android/app/build.gradle.kts" \
            2>/dev/null || true


      # ============================================================
      # 18. ADD PLAY CORE SAFETY DEPENDENCY
      #
      # Ini hanya fallback tambahan.
      # R8 tetap OFF.
      # ============================================================

      - name: Add Play Core Compatibility
        shell: bash
        run: |
          set -euo pipefail

          BUILD_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          if [ -f "$BUILD_GRADLE" ]; then

            if grep -q "com.google.android.play:core" "$BUILD_GRADLE"; then
              echo "ℹ️ Play Core dependency sudah ada."
            else

              python3 - "$BUILD_GRADLE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          dependency = """
              implementation 'com.google.android.play:core:1.10.3'
          """

          if "dependencies {" in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {" + dependency,
                  1
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

              print("✅ Play Core compatibility dependency added.")
          else:
              print("⚠️ dependencies {} block tidak ditemukan.")
          PY

            fi

          else
            echo "ℹ️ build.gradle.kts digunakan atau file tidak ditemukan."
          fi


      # ============================================================
      # 19. GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          chmod +x "$PROJECT_DIR/android/gradlew"

          echo "✅ gradlew executable."


      # ============================================================
      # 20. FLUTTER CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

          echo "✅ Flutter clean complete."


      # ============================================================
      # 21. PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "RESOLVING FLUTTER DEPENDENCIES"
          echo "=============================================="

          flutter pub get

          echo "✅ Dependencies resolved."


      # ============================================================
      # 22. VERIFY GRADLE DEPENDENCIES
      # ============================================================

      - name: Verify Android Dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew app:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            --stacktrace \
            > "$GITHUB_WORKSPACE/gradle-dependencies.txt"

          echo "✅ Android dependencies resolved."

          echo ""
          echo "Dependency report:"
          tail -n 100 "$GITHUB_WORKSPACE/gradle-dependencies.txt"


      # ============================================================
      # 23. BUILD APK
      # ============================================================

      - name: Build InterShare APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo ""
          echo "=============================================="
          echo "        INTERSHARE APK RELEASE BUILD"
          echo "=============================================="
          echo ""

          flutter build apk \
            --release \
            --no-tree-shake-icons

          echo ""
          echo "=============================================="
          echo "             BUILD SUCCESS"
          echo "=============================================="


      # ============================================================
      # 24. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK_PATH="$DEFAULT_APK"

          else

            APK_PATH="$(
              find "$PROJECT_DIR/build" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"

          fi

          if [ -z "${APK_PATH:-}" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_MB=$APK_MB" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="
          echo "Path: $APK_PATH"
          echo "Size: ${APK_MB} MB"


      # ============================================================
      # 25. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ada."
            exit 1
          fi

          file "$APK_PATH"

          echo "✅ APK verified."


      # ============================================================
      # 26. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InterShare-release
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error


      # ============================================================
      # 27. TELEGRAM SUCCESS MESSAGE
      # ============================================================

      - name: Send Telegram Result
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${OWNER_ID:-}" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          MESSAGE="🎉 InterShare APK berhasil dibuat!

          📱 InterShare
          📦 com.intershare.marnommk
          🔢 Version: 1.0.0+1
          📏 Size: ${APK_MB} MB

          ✅ Release build berhasil.
          🛡️ R8 disabled untuk kompatibilitas APK."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo "✅ Telegram result sent."


      # ============================================================
      # 28. SEND APK
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${OWNER_ID:-}" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 InterShare Release APK"

          echo "✅ APK sent to Telegram."


      # ============================================================
      # 29. FAILURE NOTIFICATION
      # ============================================================

      - name: Send Build Failure
        if: failure()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${OWNER_ID:-}" ]; then
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=❌ InterShare APK build gagal. Cek log GitHub Actions."

          echo "❌ Failure notification sent."
