name: InterShare - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter"
        required: true
        type: string

      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

jobs:
  build:
    name: Build InterShare APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.47.1"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================

      - name: Verify Owner
        shell: bash
        env:
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -euo pipefail

          if [ -z "$OWNER_ID" ]; then
            echo "❌ OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi

          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized."
            exit 1
          fi

          echo "✅ Owner verified."

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. TOOLS
      # ============================================================

      - name: Install Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            curl \
            file \
            python3

          echo "✅ Tools installed."

      # ============================================================
      # 7. ENVIRONMENT
      # ============================================================

      - name: Show Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INTERSHARE BUILD ENVIRONMENT"
          echo "=============================================="

          echo ""
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "=============================================="

      # ============================================================
      # 8. DOWNLOAD ZIP
      # ============================================================

      - name: Download Project ZIP
        shell: bash
        env:
          ZIP_URL_INPUT: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail

          ZIP_URL="$ZIP_URL_INPUT"

          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi

          # GitHub blob -> raw
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi

          echo "📥 Downloading project ZIP..."

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            --output project.zip

          if [ ! -s project.zip ]; then
            echo "❌ ZIP kosong."
            exit 1
          fi

          echo "✅ ZIP downloaded."

          ls -lh project.zip

          echo ""
          file project.zip

      # ============================================================
      # 9. EXTRACT
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf flutter_project

          mkdir -p flutter_project

          unzip -q project.zip -d flutter_project

          echo "✅ ZIP extracted."

          echo ""
          echo "Project files:"
          find flutter_project \
            -maxdepth 2 \
            -type f \
            | head -100

      # ============================================================
      # 10. FIND PUBSPEC
      # ============================================================

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(
            find "$GITHUB_WORKSPACE/flutter_project" \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "FLUTTER PROJECT DETECTED"
          echo "=============================================="

          echo "PUBSPEC:"
          echo "$PUBSPEC"

          echo ""
          echo "PROJECT:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 11. CHECK ANDROID
      # ============================================================

      - name: Check Android Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "❌ Folder android tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/android/settings.gradle.kts" ]; then
            echo "❌ settings.gradle/settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android/app" ]; then
            echo "❌ Folder android/app tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" ]; then
            echo "❌ AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          echo "✅ Android project detected."

      # ============================================================
      # 12. INSPECT ANDROID CONFIG
      # ============================================================

      - name: Inspect Android Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ANDROID CONFIGURATION"
          echo "=============================================="

          echo ""
          echo "----- settings.gradle -----"

          if [ -f "$PROJECT_DIR/android/settings.gradle" ]; then
            sed -n '1,320p' \
              "$PROJECT_DIR/android/settings.gradle"
          else
            echo "Not found."
          fi

          echo ""
          echo "----- settings.gradle.kts -----"

          if [ -f "$PROJECT_DIR/android/settings.gradle.kts" ]; then
            sed -n '1,320p' \
              "$PROJECT_DIR/android/settings.gradle.kts"
          else
            echo "Not found."
          fi

          echo ""
          echo "----- android/build.gradle -----"

          if [ -f "$PROJECT_DIR/android/build.gradle" ]; then
            sed -n '1,320p' \
              "$PROJECT_DIR/android/build.gradle"
          else
            echo "Not found."
          fi

          echo ""
          echo "----- android/app/build.gradle -----"

          if [ -f "$PROJECT_DIR/android/app/build.gradle" ]; then
            sed -n '1,380p' \
              "$PROJECT_DIR/android/app/build.gradle"
          else
            echo "Not found."
          fi

          echo ""
          echo "----- android/app/build.gradle.kts -----"

          if [ -f "$PROJECT_DIR/android/app/build.gradle.kts" ]; then
            sed -n '1,380p' \
              "$PROJECT_DIR/android/app/build.gradle.kts"
          else
            echo "Not found."
          fi

          echo ""
          echo "=============================================="

      # ============================================================
      # 13. FIX FLUTTER ANDROID EMBEDDING
      # ============================================================

      - name: Fix Flutter Android Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          try:
              tree = ET.parse(path)
          except Exception as e:
              print("❌ AndroidManifest.xml invalid:")
              print(e)
              sys.exit(1)

          root = tree.getroot()

          application = root.find("application")

          if application is None:
              print("❌ <application> tidak ditemukan.")
              sys.exit(1)

          found = False

          for child in application:

              if child.tag == "meta-data":

                  name = child.attrib.get(
                      f"{{{ANDROID}}}name"
                  )

                  if name == "flutterEmbedding":

                      child.set(
                          f"{{{ANDROID}}}value",
                          "2"
                      )

                      found = True

          if not found:

              metadata = ET.Element("meta-data")

              metadata.set(
                  f"{{{ANDROID}}}name",
                  "flutterEmbedding"
              )

              metadata.set(
                  f"{{{ANDROID}}}value",
                  "2"
              )

              application.insert(0, metadata)

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("✅ Flutter Android Embedding V2 configured.")
          PY

      # ============================================================
      # 14. VERIFY EMBEDDING
      # ============================================================

      - name: Verify Flutter Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android:name="flutterEmbedding"' "$MANIFEST"; then
            echo "❌ flutterEmbedding metadata tidak ditemukan."
            exit 1
          fi

          if ! grep -q 'android:value="2"' "$MANIFEST"; then
            echo "❌ Flutter Embedding V2 tidak aktif."
            exit 1
          fi

          echo "✅ Flutter Embedding V2 verified."

      # ============================================================
      # 15. FIX GRADLE REPOSITORIES
      # ============================================================

      - name: Fix Flutter Gradle Repositories
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/android/settings.gradle"

          if [ ! -f "$SETTINGS" ]; then
            echo "❌ settings.gradle tidak ditemukan."
            echo "Project menggunakan settings.gradle.kts."
            exit 1
          fi

          echo "=============================================="
          echo "CONFIGURING GRADLE REPOSITORIES"
          echo "=============================================="

          python3 - "$SETTINGS" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          FLUTTER_REPO = (
              "https://storage.googleapis.com/download.flutter.io"
          )

          # ========================================================
          # pluginManagement
          # ========================================================

          pm_start = text.find("pluginManagement {")

          if pm_start >= 0:

              brace_start = text.find("{", pm_start)

              depth = 0
              pm_end = None

              for i in range(
                  brace_start,
                  len(text)
              ):

                  if text[i] == "{":
                      depth += 1

                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          pm_end = i + 1
                          break

              if pm_end is None:
                  print("❌ pluginManagement invalid.")
                  sys.exit(1)

              pm_block = text[
                  pm_start:pm_end
              ]

              if "repositories {" in pm_block:

                  if "google()" not in pm_block:

                      pm_block = pm_block.replace(
                          "repositories {",
                          "repositories {\n"
                          "        google()",
                          1
                      )

                  if "mavenCentral()" not in pm_block:

                      pm_block = pm_block.replace(
                          "repositories {",
                          "repositories {\n"
                          "        mavenCentral()",
                          1
                      )

                  if "gradlePluginPortal()" not in pm_block:

                      pm_block = pm_block.replace(
                          "repositories {",
                          "repositories {\n"
                          "        gradlePluginPortal()",
                          1
                      )

              text = (
                  text[:pm_start]
                  + pm_block
                  + text[pm_end:]
              )

          # ========================================================
          # dependencyResolutionManagement
          # ========================================================

          drm_start = text.find(
              "dependencyResolutionManagement {"
          )

          if drm_start >= 0:

              brace_start = text.find(
                  "{",
                  drm_start
              )

              depth = 0
              drm_end = None

              for i in range(
                  brace_start,
                  len(text)
              ):

                  if text[i] == "{":
                      depth += 1

                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          drm_end = i + 1
                          break

              if drm_end is None:
                  print(
                      "❌ dependencyResolutionManagement invalid."
                  )
                  sys.exit(1)

              drm_block = text[
                  drm_start:drm_end
              ]

              # ----------------------------------------------------
              # Always use centralized repositories.
              # ----------------------------------------------------

              if "repositoriesMode.set" in drm_block:

                  drm_block = re.sub(
                      r"repositoriesMode\.set\s*\([^)]*\)",
                      "repositoriesMode.set("
                      "RepositoriesMode.PREFER_SETTINGS)",
                      drm_block,
                      count=1
                  )

              elif "repositoriesMode =" in drm_block:

                  drm_block = re.sub(
                      r"repositoriesMode\s*=.*",
                      "repositoriesMode.set("
                      "RepositoriesMode.PREFER_SETTINGS)",
                      drm_block,
                      count=1
                  )

              else:

                  drm_block = drm_block.replace(
                      "{",
                      "{\n"
                      "    repositoriesMode.set("
                      "RepositoriesMode.PREFER_SETTINGS)",
                      1
                  )

              # ----------------------------------------------------
              # repositories block
              # ----------------------------------------------------

              if "repositories {" not in drm_block:

                  repository_block = f"""
              repositories {{
                  google()
                  mavenCentral()

                  maven {{
                      url = uri("{FLUTTER_REPO}")
                  }}
              }}
          """

                  drm_block = (
                      drm_block[:-1]
                      + repository_block
                      + "\n}"
                  )

              else:

                  repo_start = drm_block.find(
                      "repositories {"
                  )

                  repo_brace = drm_block.find(
                      "{",
                      repo_start
                  )

                  depth = 0
                  repo_end = None

                  for i in range(
                      repo_brace,
                      len(drm_block)
                  ):

                      if drm_block[i] == "{":
                          depth += 1

                      elif drm_block[i] == "}":
                          depth -= 1

                          if depth == 0:
                              repo_end = i + 1
                              break

                  if repo_end is None:
                      print(
                          "❌ repositories block invalid."
                      )
                      sys.exit(1)

                  repo_block = drm_block[
                      repo_start:repo_end
                  ]

                  if "google()" not in repo_block:

                      repo_block = repo_block.replace(
                          "repositories {",
                          "repositories {\n"
                          "        google()",
                          1
                      )

                  if "mavenCentral()" not in repo_block:

                      repo_block = repo_block.replace(
                          "repositories {",
                          "repositories {\n"
                          "        mavenCentral()",
                          1
                      )

                  if FLUTTER_REPO not in repo_block:

                      repo_block = repo_block.replace(
                          "repositories {",
                          "repositories {\n"
                          "        maven {\n"
                          f'            url = uri("{FLUTTER_REPO}")\n'
                          "        }",
                          1
                      )

                  drm_block = (
                      drm_block[:repo_start]
                      + repo_block
                      + drm_block[repo_end:]
                  )

              text = (
                  text[:drm_start]
                  + drm_block
                  + text[drm_end:]
              )

          else:

              block = f"""
          dependencyResolutionManagement {{
              repositoriesMode.set(
                  RepositoriesMode.PREFER_SETTINGS
              )

              repositories {{
                  google()
                  mavenCentral()

                  maven {{
                      url = uri("{FLUTTER_REPO}")
                  }}
              }}
          }}

          """

              marker = "rootProject.name"

              if marker in text:

                  text = text.replace(
                      marker,
                      block + marker,
                      1
                  )

              else:

                  text = block + text

          path.write_text(text)

          print(
              "✅ Gradle repositories configured."
          )
          PY

          echo ""
          echo "=============================================="
          echo "UPDATED settings.gradle"
          echo "=============================================="

          cat "$SETTINGS"

      # ============================================================
      # 16. VERIFY REPOSITORIES
      # ============================================================

      - name: Verify Gradle Repositories
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/android/settings.gradle"

          echo "=============================================="
          echo "VERIFY GRADLE REPOSITORIES"
          echo "=============================================="

          if grep -q "PREFER_PROJECT" "$SETTINGS"; then
            echo "❌ PREFER_PROJECT masih ditemukan."
            exit 1
          fi

          if ! grep -q "PREFER_SETTINGS" "$SETTINGS"; then
            echo "❌ PREFER_SETTINGS tidak ditemukan."
            exit 1
          fi

          if ! grep -q "google()" "$SETTINGS"; then
            echo "❌ google() tidak ditemukan."
            exit 1
          fi

          if ! grep -q "mavenCentral()" "$SETTINGS"; then
            echo "❌ mavenCentral() tidak ditemukan."
            exit 1
          fi

          if ! grep -q \
            "storage.googleapis.com/download.flutter.io" \
            "$SETTINGS"; then

            echo "❌ Flutter Maven repository tidak ditemukan."
            exit 1
          fi

          echo "✅ PREFER_SETTINGS"
          echo "✅ google()"
          echo "✅ mavenCentral()"
          echo "✅ Flutter Maven"

      # ============================================================
      # 17. DISABLE R8 / MINIFICATION
      # ============================================================

      - name: Disable Release R8
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="$PROJECT_DIR/android/app/build.gradle"
          GRADLE_KTS="$PROJECT_DIR/android/app/build.gradle.kts"

          echo "=============================================="
          echo "DISABLING RELEASE R8"
          echo "=============================================="

          if [ -f "$GRADLE" ]; then

            python3 - "$GRADLE" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          # --------------------------------------------------------
          # Groovy:
          #
          # minifyEnabled true
          # minifyEnabled = true
          # --------------------------------------------------------

          text = re.sub(
              r"minifyEnabled\s*=?\s*true",
              "minifyEnabled false",
              text,
              flags=re.IGNORECASE
          )

          # --------------------------------------------------------
          # Groovy:
          #
          # shrinkResources true
          # shrinkResources = true
          # --------------------------------------------------------

          text = re.sub(
              r"shrinkResources\s*=?\s*true",
              "shrinkResources false",
              text,
              flags=re.IGNORECASE
          )

          # --------------------------------------------------------
          # isMinifyEnabled true
          # --------------------------------------------------------

          text = re.sub(
              r"isMinifyEnabled\s*=?\s*true",
              "isMinifyEnabled = false",
              text,
              flags=re.IGNORECASE
          )

          # --------------------------------------------------------
          # isShrinkResources true
          # --------------------------------------------------------

          text = re.sub(
              r"isShrinkResources\s*=?\s*true",
              "isShrinkResources = false",
              text,
              flags=re.IGNORECASE
          )

          path.write_text(text)

          print(
              "✅ Groovy release minification disabled."
          )
          PY

          fi

          if [ -f "$GRADLE_KTS" ]; then

            python3 - "$GRADLE_KTS" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          text = re.sub(
              r"isMinifyEnabled\s*=\s*true",
              "isMinifyEnabled = false",
              text,
              flags=re.IGNORECASE
          )

          text = re.sub(
              r"isShrinkResources\s*=\s*true",
              "isShrinkResources = false",
              text,
              flags=re.IGNORECASE
          )

          path.write_text(text)

          print(
              "✅ Kotlin DSL release minification disabled."
          )
          PY

          fi

          echo ""
          echo "----- FINAL app/build.gradle -----"

          if [ -f "$GRADLE" ]; then
            sed -n '1,420p' "$GRADLE"
          fi

          echo ""
          echo "----- FINAL app/build.gradle.kts -----"

          if [ -f "$GRADLE_KTS" ]; then
            sed -n '1,420p' "$GRADLE_KTS"
          fi

      # ============================================================
      # 18. VERIFY R8 IS DISABLED
      # ============================================================

      - name: Verify R8 Configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="$PROJECT_DIR/android/app/build.gradle"
          GRADLE_KTS="$PROJECT_DIR/android/app/build.gradle.kts"

          echo "=============================================="
          echo "VERIFY R8 CONFIGURATION"
          echo "=============================================="

          if [ -f "$GRADLE" ]; then

            if grep -Eiq \
              "minifyEnabled[[:space:]]*=?[[:space:]]*true" \
              "$GRADLE"; then

              echo "❌ minifyEnabled true masih ditemukan."
              exit 1
            fi

            if grep -Eiq \
              "isMinifyEnabled[[:space:]]*=?[[:space:]]*true" \
              "$GRADLE"; then

              echo "❌ isMinifyEnabled true masih ditemukan."
              exit 1
            fi

          fi

          if [ -f "$GRADLE_KTS" ]; then

            if grep -Eiq \
              "isMinifyEnabled[[:space:]]*=[[:space:]]*true" \
              "$GRADLE_KTS"; then

              echo "❌ isMinifyEnabled true masih ditemukan."
              exit 1
            fi

          fi

          echo "✅ Release R8/minification disabled."

      # ============================================================
      # 19. PREPARE GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "❌ gradlew tidak ditemukan."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/android/gradlew"

          echo "✅ gradlew executable."

      # ============================================================
      # 20. GRADLE VERSION
      # ============================================================

      - name: Show Gradle Version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew --version

      # ============================================================
      # 21. FLUTTER DOCTOR
      # ============================================================

      - name: Flutter Doctor
        shell: bash
        run: |
          set -euo pipefail

          flutter doctor -v || true

      # ============================================================
      # 22. FLUTTER CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

          echo "✅ Flutter clean complete."

      # ============================================================
      # 23. STOP GRADLE
      # ============================================================

      - name: Stop Gradle Daemon
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew --stop || true

          echo "✅ Gradle daemon stopped."

      # ============================================================
      # 24. PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "RESOLVING FLUTTER DEPENDENCIES"
          echo "=============================================="

          flutter pub get

          echo ""
          echo "✅ Dependencies resolved."

      # ============================================================
      # 25. VERIFY GENERATED CONFIG
      # ============================================================

      - name: Verify Flutter Generated Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "FLUTTER GENERATED CONFIGURATION"
          echo "=============================================="

          if [ -f "$PROJECT_DIR/android/local.properties" ]; then

            echo ""
            echo "----- local.properties -----"

            sed \
              's#flutter.sdk=.*#flutter.sdk=***#' \
              "$PROJECT_DIR/android/local.properties" \
              || true

          fi

          echo ""
          echo "----- Flutter Plugin Loader -----"

          grep -R \
            -n \
            "flutter-plugin-loader" \
            "$PROJECT_DIR/android" \
            --exclude-dir=.gradle \
            2>/dev/null \
            | head -20 \
            || true

          echo ""
          echo "----- Flutter Gradle Plugin -----"

          grep -R \
            -n \
            "flutter-gradle-plugin" \
            "$PROJECT_DIR/android" \
            --exclude-dir=.gradle \
            2>/dev/null \
            | head -20 \
            || true

      # ============================================================
      # 26. FINAL GRADLE CHECK
      # ============================================================

      - name: Final Gradle Check
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "=============================================="
          echo "FINAL GRADLE CHECK"
          echo "=============================================="

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace

          echo ""
          echo "✅ Gradle configuration is valid."

      # ============================================================
      # 27. BUILD APK
      # ============================================================

      - name: Build InterShare APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo ""
          echo "=============================================="
          echo "        INTERSHARE APK RELEASE BUILD"
          echo "=============================================="
          echo ""

          flutter build apk \
            --release \
            --no-tree-shake-icons

          echo ""
          echo "=============================================="
          echo "             BUILD SUCCESS"
          echo "=============================================="

      # ============================================================
      # 28. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK_PATH="$DEFAULT_APK"

          else

            APK_PATH="$(
              find "$PROJECT_DIR/build" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"

          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_MB=$APK_MB" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="

          echo "Path:"
          echo "$APK_PATH"

          echo ""
          echo "Size:"
          echo "${APK_MB} MB"

          echo ""
          echo "File:"
          file "$APK_PATH"

      # ============================================================
      # 29. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InterShare-release
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 30. TELEGRAM SUCCESS MESSAGE
      # ============================================================

      - name: Send Telegram Result
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          MESSAGE="🎉 InterShare APK berhasil dibuat!

          📱 InterShare
          📦 com.intershare.marnommk
          🔢 Version: 1.0.0+1
          📏 Size: ${APK_MB} MB

          ✅ Release build berhasil."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo "✅ Telegram success message sent."

      # ============================================================
      # 31. SEND APK TO TELEGRAM
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 InterShare Release APK"

          echo "✅ APK sent to Telegram."

      # ============================================================
      # 32. FAILURE NOTIFICATION
      # ============================================================

      - name: Send Build Failure
        if: failure()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=❌ InterShare APK build gagal. Cek log GitHub Actions."

          echo "❌ Failure notification sent."
