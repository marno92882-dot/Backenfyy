name: InterShare - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter (raw/direct download)"
        required: true
        type: string

      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

jobs:
  build:
    name: Build InterShare APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.47.1"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================

      - name: Verify Owner
        shell: bash
        env:
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -euo pipefail

          if [ -z "$OWNER_ID" ]; then
            echo "❌ Secret OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi

          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized."
            exit 1
          fi

          echo "✅ Owner verified."

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. FLUTTER 3.47.1
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. INSTALL BASIC TOOLS
      # ============================================================

      - name: Install Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            curl \
            file \
            python3 \
            xmlstarlet

          echo "✅ Tools installed."

      # ============================================================
      # 7. SHOW ENVIRONMENT
      # ============================================================

      - name: Show Build Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INTERSHARE BUILD ENVIRONMENT"
          echo "=============================================="

          flutter --version
          java -version
          dart --version

          echo "=============================================="

      # ============================================================
      # 8. DOWNLOAD ZIP
      # ============================================================

      - name: Download Project ZIP
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail

          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi

          # GitHub blob -> raw
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi

          echo "📥 Downloading project..."

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            --output project.zip

          if [ ! -s project.zip ]; then
            echo "❌ project.zip kosong."
            exit 1
          fi

          echo "✅ Project ZIP downloaded."

          ls -lh project.zip

      # ============================================================
      # 9. EXTRACT
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf flutter_project

          mkdir -p flutter_project

          unzip -q project.zip -d flutter_project

          echo "✅ ZIP extracted."

      # ============================================================
      # 10. FIND PUBSPEC
      # ============================================================

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(
            find "$GITHUB_WORKSPACE/flutter_project" \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "Flutter project detected:"
          echo "$PROJECT_DIR"
          echo "=============================================="

      # ============================================================
      # 11. CHECK ANDROID PROJECT
      # ============================================================

      - name: Check Android Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "❌ Folder android tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/android/settings.gradle.kts" ]; then
            echo "❌ settings.gradle/settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/android/app/build.gradle.kts" ]; then
            echo "❌ app/build.gradle atau app/build.gradle.kts tidak ditemukan."
            exit 1
          fi

          echo "✅ Android project detected."

      # ============================================================
      # 12. VALIDATE MANIFEST
      # ============================================================

      - name: Validate AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          try:
              ET.parse(path)
              print("✅ AndroidManifest.xml valid.")
          except Exception as e:
              print("❌ AndroidManifest.xml invalid.")
              print(e)
              sys.exit(1)
          PY

      # ============================================================
      # 13. PREPARE GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$PROJECT_DIR/android/gradlew"

          if [ -f "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            echo "✅ gradlew executable."
          else
            echo "⚠️ gradlew tidak ditemukan."
            echo "Flutter akan menggunakan konfigurasi project yang tersedia."
          fi

      # ============================================================
      # 14. DO NOT OVERRIDE AGP / GRADLE
      # ============================================================

      - name: Keep Project Gradle Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Gradle/AGP override DISABLED"
          echo "=============================================="

          echo "Project Gradle configuration will be preserved."
          echo "No forced AGP version."
          echo "No forced Gradle version."
          echo "No automatic repository replacement."

      # ============================================================
      # 15. FLUTTER CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

          echo "✅ Flutter clean complete."

      # ============================================================
      # 16. PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "FLUTTER PUB GET"
          echo "=============================================="

          flutter pub get

          echo "=============================================="
          echo "DEPENDENCIES READY"
          echo "=============================================="

      # ============================================================
      # 17. BUILD APK
      # ============================================================

      - name: Build InterShare APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "        INTERSHARE APK RELEASE BUILD"
          echo "=============================================="

          flutter build apk \
            --release \
            --no-tree-shake-icons

          echo "=============================================="
          echo "             BUILD SUCCESS"
          echo "=============================================="

      # ============================================================
      # 18. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$DEFAULT_APK" ]; then
            APK_PATH="$DEFAULT_APK"
          else
            APK_PATH="$(
              find "$PROJECT_DIR/build" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_MB=$APK_MB" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="
          echo "Path: $APK_PATH"
          echo "Size: ${APK_MB} MB"

      # ============================================================
      # 19. UPLOAD APK ARTIFACT
      # ============================================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterShare-release
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 20. SEND TELEGRAM MESSAGE
      # ============================================================

      - name: Send Telegram Build Result
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials belum diset."
            exit 0
          fi

          MESSAGE="🎉 InterShare APK berhasil dibuat!

          📱 App: InterShare
          📦 Package: com.intershare.marnommk
          🔢 Version: 1.0.0+1
          📏 Size: ${APK_MB} MB

          ✅ Release build berhasil."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo "✅ Telegram notification sent."

      # ============================================================
      # 21. SEND APK TO TELEGRAM
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials belum diset."
            exit 0
          fi

          echo "📤 Sending APK to Telegram..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 InterShare Release APK"

          echo "✅ APK sent to Telegram."

      # ============================================================
      # 22. BUILD FAILURE TELEGRAM
      # ============================================================

      - name: Send Build Failure
        if: failure()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=❌ InterShare APK build gagal. Silakan cek log GitHub Actions."

          echo "❌ Failure notification sent."
