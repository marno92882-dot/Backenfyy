name: InterShare - Direct APK Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct/raw URL ZIP InterShare"
        required: true
        type: string

      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

jobs:
  build:
    name: Build InterShare APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.47.0"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================

      - name: Verify Owner
        shell: bash
        env:
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -e

          if [ -z "$OWNER_ID" ]; then
            echo "OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "Unauthorized."
            exit 1
          fi

          echo "Owner verified."

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ============================================================
      # 6. DOWNLOAD ZIP
      # ============================================================

      - name: Download ZIP
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            -o project.zip

          test -s project.zip

          echo "ZIP downloaded."

      # ============================================================
      # 7. EXTRACT
      # ============================================================

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf flutter_project
          mkdir flutter_project

          unzip -q project.zip -d flutter_project

      # ============================================================
      # 8. FIND FLUTTER PROJECT
      # ============================================================

      - name: Detect Project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find flutter_project \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 9. BASIC CONFIG
      # ============================================================

      - name: Prepare Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x android/gradlew || true

          mkdir -p android

          touch android/gradle.properties

          grep -q "^android.useAndroidX=true" \
            android/gradle.properties \
            || echo "android.useAndroidX=true" >> android/gradle.properties

          grep -q "^android.enableJetifier=true" \
            android/gradle.properties \
            || echo "android.enableJetifier=true" >> android/gradle.properties

      # ============================================================
      # 10. PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter pub get

      # ============================================================
      # 11. DIRECT BUILD
      # ============================================================

      - name: Build APK Release
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING INTERSHARE APK"
          echo "======================================"

          flutter build apk --release

          echo "======================================"
          echo "BUILD SUCCESS"
          echo "======================================"

      # ============================================================
      # 12. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            APK=$(find "$PROJECT_DIR/build" \
              -type f \
              -name "*.apk" \
              | head -n 1)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")
          MB=$((SIZE / 1024 / 1024))

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_MB=$MB" >> "$GITHUB_ENV"

          echo "APK: $APK"
          echo "SIZE: ${MB} MB"

      # ============================================================
      # 13. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InterShare-release
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 14. TELEGRAM MESSAGE
      # ============================================================

      - name: Send Telegram Message
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -e

          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=🎉 InterShare berhasil build!%0A📦 Size: ${APK_MB} MB"

      # ============================================================
      # 15. SEND APK
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -e

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 InterShare 1.0.0+1 Release APK"
