name: InterShare - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct/raw download URL file ZIP"
        required: true
        type: string

      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

jobs:
  build:
    name: Build InterShare APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.27.0"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================

      - name: Verify Owner
        shell: bash
        env:
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -e

          if [ -z "$OWNER_ID" ]; then
            echo "❌ OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi

          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized."
            exit 1
          fi

          echo "✅ Owner verified."

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. TOOLS
      # ============================================================

      - name: Install Tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip curl file python3

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "✅ Build environment ready."

      # ============================================================
      # 7. DOWNLOAD ZIP
      # ============================================================

      - name: Download Project ZIP
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi

          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi

          echo "📥 Downloading project..."

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            --output project.zip

          test -s project.zip

          echo "✅ ZIP downloaded."
          du -h project.zip

      # ============================================================
      # 8. EXTRACT
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf flutter_project
          mkdir -p flutter_project

          unzip -q project.zip -d flutter_project

          echo "✅ ZIP extracted."

      # ============================================================
      # 9. DETECT PUBSPEC
      # ============================================================

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -e

          PUBSPEC="$(
            find "$GITHUB_WORKSPACE/flutter_project" \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "📁 Project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # 10. CHECK MANIFEST
      # ============================================================

      - name: Prepare Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml tidak ditemukan:"
            echo "$MANIFEST"
            exit 1
          fi

          echo "📄 Checking AndroidManifest.xml"

          # Pastikan XML dapat diparse sebelum melakukan perubahan.
          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          try:
              ET.parse(path)
              print("✅ AndroidManifest.xml valid.")
          except Exception as e:
              print("❌ AndroidManifest.xml invalid:")
              print(e)
              sys.exit(1)
          PY

      # ============================================================
      # 11. ENSURE FLUTTER EMBEDDING V2
      # ============================================================

      - name: Ensure Flutter Embedding V2
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          tree = ET.parse(path)
          root = tree.getroot()

          application = root.find("application")

          if application is None:
              raise SystemExit(
                  "❌ <application> tidak ditemukan di AndroidManifest.xml"
              )

          ANDROID_NS = "http://schemas.android.com/apk/res/android"

          exists = False

          for child in application:
              if child.tag.endswith("meta-data"):
                  name = child.attrib.get(
                      "{%s}name" % ANDROID_NS
                  )

                  if name == "flutterEmbedding":
                      exists = True

                      child.set(
                          "{%s}value" % ANDROID_NS,
                          "2"
                      )

          if not exists:
              metadata = ET.Element("meta-data")

              metadata.set(
                  "{%s}name" % ANDROID_NS,
                  "flutterEmbedding"
              )

              metadata.set(
                  "{%s}value" % ANDROID_NS,
                  "2"
              )

              application.insert(0, metadata)

          ET.register_namespace(
              "android",
              ANDROID_NS
          )

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("✅ Flutter Android Embedding V2 configured.")
          PY

      # ============================================================
      # 12. VALIDATE MANIFEST AGAIN
      # ============================================================

      - name: Validate Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          try:
              ET.parse(path)
              print("✅ AndroidManifest.xml valid after patch.")
          except Exception as e:
              print("❌ Manifest masih invalid:")
              print(e)
              sys.exit(1)
          PY

      # ============================================================
      # 13. ANDROIDX
      # ============================================================

      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          PROPERTIES="$PROJECT_DIR/android/gradle.properties"

          touch "$PROPERTIES"

          grep -q "^android.useAndroidX=true" "$PROPERTIES" \
            || echo "android.useAndroidX=true" >> "$PROPERTIES"

          grep -q "^android.enableJetifier=true" "$PROPERTIES" \
            || echo "android.enableJetifier=true" >> "$PROPERTIES"

          echo "✅ AndroidX configured."

      # ============================================================
      # 14. GRADLE PERMISSION
      # ============================================================

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/android/gradlew" ]; then
            chmod +x "$PROJECT_DIR/android/gradlew"
          fi

          echo "✅ Gradle wrapper prepared."

      # ============================================================
      # 15. PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter pub get

          echo "✅ Dependencies installed."

      # ============================================================
      # 16. DIRECT BUILD
      # ============================================================

      - name: Build APK Release
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "        INTERSHARE APK RELEASE BUILD"
          echo "=============================================="

          flutter build apk --release

          echo "=============================================="
          echo "             BUILD SUCCESS"
          echo "=============================================="

      # ============================================================
      # 17. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            APK="$(
              find "$PROJECT_DIR/build" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")
          MB=$((SIZE / 1024 / 1024))

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_MB=$MB" >> "$GITHUB_ENV"

          echo "📦 APK:"
          echo "$APK"
          echo "📏 Size: ${MB} MB"

      # ============================================================
      # 18. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterShare-release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 19. TELEGRAM MESSAGE
      # ============================================================

      - name: Send Telegram Message
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -e

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          TEXT="🎉 InterShare APK berhasil dibuat!

          📱 InterShare
          📦 com.intershare.marnommk
          🔢 1.0.0+1
          📏 ${APK_MB} MB

          ✅ Release build berhasil."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=${TEXT}"

      # ============================================================
      # 20. SEND APK TELEGRAM
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -e

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 InterShare 1.0.0+1 Release APK"

          echo "✅ APK sent to Telegram."

      # ============================================================
      # 21. FAILURE MESSAGE
      # ============================================================

      - name: Send Build Failure
        if: failure()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -e

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=❌ InterShare APK build gagal. Cek GitHub Actions log."

          echo "❌ Failure notification sent."
