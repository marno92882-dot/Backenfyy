name: InterShare - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter"
        required: true
        type: string

      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

jobs:
  build:
    name: Build InterShare APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.24.5"  # Ganti ke versi yang stabil
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================

      - name: Verify Owner
        shell: bash
        env:
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          set -euo pipefail

          echo "Debug: OWNER_ID = ${OWNER_ID:-empty}"
          echo "Debug: CHAT_ID = ${CHAT_ID:-empty}"

          if [ -z "${OWNER_ID:-}" ]; then
            echo "❌ OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ -z "${CHAT_ID:-}" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi

          # Trim whitespace
          OWNER_ID_TRIMMED=$(echo "$OWNER_ID" | xargs)
          CHAT_ID_TRIMMED=$(echo "$CHAT_ID" | xargs)

          if [ "$OWNER_ID_TRIMMED" != "$CHAT_ID_TRIMMED" ]; then
            echo "❌ Unauthorized."
            echo "Owner: $OWNER_ID_TRIMMED"
            echo "Chat: $CHAT_ID_TRIMMED"
            exit 1
          fi

          echo "✅ Owner verified."

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. TOOLS
      # ============================================================

      - name: Install Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            curl \
            file \
            python3 \
            xmlstarlet

          echo "✅ Tools installed."

      # ============================================================
      # 7. ENVIRONMENT
      # ============================================================

      - name: Show Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INTERSHARE BUILD ENVIRONMENT"
          echo "=============================================="

          flutter --version
          dart --version
          java -version

          echo ""
          flutter doctor -v || true

      # ============================================================
      # 8. DOWNLOAD ZIP
      # ============================================================

      - name: Download Project ZIP
        shell: bash
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
        run: |
          set -euo pipefail

          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi

          # GitHub blob -> raw
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi

          echo "📥 Downloading project ZIP from: $ZIP_URL"

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --retry-connrefused \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            --output project.zip

          if [ ! -s project.zip ]; then
            echo "❌ ZIP kosong."
            exit 1
          fi

          echo "✅ ZIP downloaded."

          ls -lh project.zip

      # ============================================================
      # 9. EXTRACT
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf flutter_project

          mkdir -p flutter_project

          unzip -q project.zip -d flutter_project

          echo "✅ ZIP extracted."

          # List contents
          find flutter_project -maxdepth 3 -type f | head -n 50

      # ============================================================
      # 10. FIND PUBSPEC
      # ============================================================

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(
            find "$GITHUB_WORKSPACE/flutter_project" \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "Directory structure:"
            find flutter_project -maxdepth 5 -type d | head -n 30
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "PROJECT"
          echo "=============================================="
          echo "$PROJECT_DIR"

      # ============================================================
      # 11. CHECK ANDROID
      # ============================================================

      - name: Check Android Project
        shell: bash
        run: |
          set -euo pipefail

          echo "PROJECT_DIR: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "❌ Folder android tidak ditemukan."
            echo "Contents:"
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" ]; then
            echo "❌ AndroidManifest.xml tidak ditemukan."
            echo "Android folder:"
            find "$PROJECT_DIR/android" -maxdepth 3 -type f | head -n 30
            exit 1
          fi

          echo "✅ Android project detected."

      # ============================================================
      # 12. BACKUP GRADLE FILES
      # ============================================================

      - name: Backup Android Gradle Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/.gradle-backup"

          cp -f \
            "$PROJECT_DIR/android/settings.gradle" \
            "$PROJECT_DIR/.gradle-backup/settings.gradle" \
            2>/dev/null || true

          cp -f \
            "$PROJECT_DIR/android/settings.gradle.kts" \
            "$PROJECT_DIR/.gradle-backup/settings.gradle.kts" \
            2>/dev/null || true

          cp -f \
            "$PROJECT_DIR/android/build.gradle" \
            "$PROJECT_DIR/.gradle-backup/build.gradle" \
            2>/dev/null || true

          cp -f \
            "$PROJECT_DIR/android/build.gradle.kts" \
            "$PROJECT_DIR/.gradle-backup/build.gradle.kts" \
            2>/dev/null || true

          cp -f \
            "$PROJECT_DIR/android/app/build.gradle" \
            "$PROJECT_DIR/.gradle-backup/app-build.gradle" \
            2>/dev/null || true

          cp -f \
            "$PROJECT_DIR/android/app/build.gradle.kts" \
            "$PROJECT_DIR/.gradle-backup/app-build.gradle.kts" \
            2>/dev/null || true

          cp -f \
            "$PROJECT_DIR/android/gradle.properties" \
            "$PROJECT_DIR/.gradle-backup/gradle.properties" \
            2>/dev/null || true

          echo "✅ Gradle files backed up."

      # ============================================================
      # 13. REPAIR SETTINGS.GRADLE
      # ============================================================

      - name: Repair Android Settings
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/android/settings.gradle"

          if [ ! -f "$SETTINGS" ]; then
            echo "❌ settings.gradle tidak ditemukan."
            exit 1
          fi

          cat > "$SETTINGS" <<'EOF'
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")

        if (!localPropertiesFile.exists()) {
            throw new GradleException(
                "local.properties tidak ditemukan."
            )
        }

        localPropertiesFile.withInputStream {
            properties.load(it)
        }

        def flutterSdkPath = properties.getProperty("flutter.sdk")

        if (flutterSdkPath == null) {
            throw new GradleException(
                "flutter.sdk tidak ditemukan di local.properties."
            )
        }

        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.5.2" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "intershare"

include ":app"
EOF

          echo "✅ settings.gradle repaired."

          echo ""
          echo "========== settings.gradle =========="
          cat "$SETTINGS"

      # ============================================================
      # 14. REPAIR GRADLE PROPERTIES
      # ============================================================

      - name: Repair Gradle Properties
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES="$PROJECT_DIR/android/gradle.properties"

          touch "$PROPERTIES"

          # Remove old flags
          sed -i \
            '/^[[:space:]]*android\.builtInKotlin[[:space:]]*=/d' \
            "$PROPERTIES" || true

          sed -i \
            '/^[[:space:]]*android\.newDsl[[:space:]]*=/d' \
            "$PROPERTIES" || true

          sed -i \
            '/^[[:space:]]*org\.gradle\.project\.repos[[:space:]]*=/d' \
            "$PROPERTIES" || true

          cat >> "$PROPERTIES" <<'EOF'

# ============================================================
# InterShare CI compatibility
# ============================================================

android.useAndroidX=true
android.enableJetifier=true

# Use legacy Kotlin Gradle Plugin mode.
android.builtInKotlin=false
android.newDsl=false

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
EOF

          echo "✅ gradle.properties repaired."

          echo ""
          echo "========== gradle.properties =========="
          cat "$PROPERTIES"

      # ============================================================
      # 15. REPAIR ROOT BUILD.GRADLE
      # ============================================================

      - name: Repair Root Build Gradle
        shell: bash
        run: |
          set -euo pipefail

          BUILD="$PROJECT_DIR/android/build.gradle"

          cat > "$BUILD" <<'EOF'
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
EOF

          echo "✅ android/build.gradle repaired."

      # ============================================================
      # 16. REPAIR APP BUILD.GRADLE
      # ============================================================

      - name: Repair App Build Gradle
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/android/app/build.gradle"

          if [ ! -f "$APP" ]; then
            echo "❌ android/app/build.gradle tidak ditemukan."
            exit 1
          fi

          python3 - "$APP" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove Kotlin Gradle Plugin from plugins blocks
          text = re.sub(
              r'(?m)^[ \t]*id[ \t]+[\'"]kotlin-android[\'"][ \t]*(?:version[^\n]*)?\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*id[ \t]+[\'"]org\.jetbrains\.kotlin\.android[\'"][ \t]*(?:version[^\n]*)?\n?',
              '',
              text
          )

          # Remove old imperative Kotlin plugin
          text = re.sub(
              r'(?m)^[ \t]*apply[ \t]+plugin:[ \t]*[\'"]kotlin-android[\'"][ \t]*\n?',
              '',
              text
          )

          # Remove old kotlinOptions blocks
          pattern = re.compile(
              r'(?ms)^[ \t]*kotlinOptions[ \t]*\{.*?^[ \t]*\}[ \t]*'
          )

          text = pattern.sub('', text)

          # Ensure Flutter Gradle plugin exists
          if "dev.flutter.flutter-gradle-plugin" not in text:
              match = re.search(
                  r'(?ms)^[ \t]*plugins[ \t]*\{.*?^[ \t]*\}',
                  text
              )

              if match:
                  block = match.group(0)

                  if "com.android.application" in block:
                      block = block.rstrip() + '\n    id "dev.flutter.flutter-gradle-plugin"\n}'
                      text = text[:match.start()] + block + text[match.end():]
                  else:
                      text = (
                          'plugins {\n'
                          '    id "com.android.application"\n'
                          '    id "dev.flutter.flutter-gradle-plugin"\n'
                          '}\n\n'
                          + text
                      )
              else:
                  text = (
                      'plugins {\n'
                      '    id "com.android.application"\n'
                      '    id "dev.flutter.flutter-gradle-plugin"\n'
                      '}\n\n'
                      + text
                  )

          # Remove old Flutter imperative apply
          text = re.sub(
              r'(?m)^[ \t]*apply[ \t]+from:[ \t]*["\'].*flutter_tools.*["\'][ \t]*\n?',
              '',
              text
          )

          # Remove accidental Kotlin compilerOptions blocks
          text = re.sub(
              r'(?ms)^[ \t]*kotlin[ \t]*\{.*?compilerOptions.*?^[ \t]*\}[ \t]*\}[ \t]*',
              '',
              text
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ app/build.gradle repaired.")
          PY

          echo ""
          echo "========== app/build.gradle =========="
          sed -n '1,260p' "$APP"

      # ============================================================
      # 17. CREATE/REPAIR LOCAL.PROPERTIES
      # ============================================================

      - name: Configure Flutter SDK
        shell: bash
        run: |
          set -euo pipefail

          LOCAL="$PROJECT_DIR/android/local.properties"

          FLUTTER_BIN="$(which flutter)"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$ANDROID_SDK" ]; then
            echo "❌ Android SDK tidak ditemukan."
            echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-empty}"
            echo "ANDROID_HOME: ${ANDROID_HOME:-empty}"
            exit 1
          fi

          cat > "$LOCAL" <<EOF
sdk.dir=$ANDROID_SDK
flutter.sdk=$FLUTTER_ROOT
flutter.buildMode=release
flutter.versionName=1.0.0
flutter.versionCode=1
EOF

          echo "✅ local.properties configured."

          cat "$LOCAL"

      # ============================================================
      # 18. FIX MANIFEST
      # ============================================================

      - name: Fix Flutter Android Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          try:
              tree = ET.parse(path)
          except Exception as e:
              print("❌ AndroidManifest.xml invalid:")
              print(e)
              sys.exit(1)

          root = tree.getroot()

          application = root.find("application")

          if application is None:
              print("❌ <application> tidak ditemukan.")
              sys.exit(1)

          found = False

          for child in application:
              if child.tag == "meta-data":

                  name = child.attrib.get(
                      f"{{{ANDROID}}}name"
                  )

                  if name == "flutterEmbedding":

                      child.set(
                          f"{{{ANDROID}}}value",
                          "2"
                      )

                      found = True

          if not found:

              metadata = ET.Element("meta-data")

              metadata.set(
                  f"{{{ANDROID}}}name",
                  "flutterEmbedding"
              )

              metadata.set(
                  f"{{{ANDROID}}}value",
                  "2"
              )

              application.insert(0, metadata)

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("✅ Flutter Android Embedding V2 configured.")
          PY

      # ============================================================
      # 19. VERIFY MANIFEST
      # ============================================================

      - name: Verify Flutter Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'flutterEmbedding' "$MANIFEST"; then
            echo "❌ flutterEmbedding metadata tidak ditemukan."
            exit 1
          fi

          if ! grep -q 'android:value="2"' "$MANIFEST"; then
            echo "❌ Flutter Embedding V2 tidak aktif."
            exit 1
          fi

          echo "✅ Flutter Embedding V2 verified."

      # ============================================================
      # 20. ADD PLAY CORE
      # ============================================================

      - name: Add Play Core Dependency
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/android/app/build.gradle"

          python3 - "$APP" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          dependency = (
              "    implementation "
              "'com.google.android.play:core:1.10.3'"
          )

          if "com.google.android.play:core" not in text:

              match = re.search(
                  r'(?ms)^dependencies[ \t]*\{.*?^[ \t]*\}',
                  text
              )

              if match:
                  block = match.group(0)

                  block = block.rstrip()
                  block = block[:-1]
                  block += "\n" + dependency + "\n}"

                  text = (
                      text[:match.start()]
                      + block
                      + text[match.end():]
                  )

              else:
                  text += (
                      "\n\ndependencies {\n"
                      + dependency
                      + "\n}\n"
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ Play Core dependency configured.")
          PY

      # ============================================================
      # 21. CREATE PROGUARD RULES
      # ============================================================

      - name: Configure R8 Rules
        shell: bash
        run: |
          set -euo pipefail

          PROGUARD_DIR="$PROJECT_DIR/android/app"

          mkdir -p "$PROGUARD_DIR"

          cat > "$PROGUARD_DIR/proguard-rules.pro" <<'EOF'
# ============================================================
# Flutter
# ============================================================

-keep class io.flutter.** { *; }

-dontwarn io.flutter.**

# ============================================================
# Google Play Core
# ============================================================

-keep class com.google.android.play.core.** { *; }

-dontwarn com.google.android.play.core.**

# ============================================================
# AndroidX
# ============================================================

-dontwarn androidx.**

# ============================================================
# Kotlin
# ============================================================

-dontwarn kotlin.**
EOF

          echo "✅ R8 rules created."

      # ============================================================
      # 22. ENSURE PROGUARD FILE IS USED
      # ============================================================

      - name: Configure Release R8
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/android/app/build.gradle"

          python3 - "$APP" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # If release block exists, add proguard rule.
          match = re.search(
              r'(?ms)release[ \t]*\{.*?^[ \t]*\}',
              text
          )

          if match:

              block = match.group(0)

              if "proguard-rules.pro" not in block:

                  insertion = (
                      "\n        proguardFiles "
                      "getDefaultProguardFile("
                      "'proguard-android-optimize.txt'"
                      "), 'proguard-rules.pro'"
                  )

                  block = block.rstrip()
                  block = block[:-1]
                  block += insertion + "\n    }"

                  text = (
                      text[:match.start()]
                      + block
                      + text[match.end():]
                  )

          else:

              # No buildTypes block.
              text += """
              
buildTypes {
    release {
        minifyEnabled true
        shrinkResources true
        proguardFiles getDefaultProguardFile(
            'proguard-android-optimize.txt'
        ), 'proguard-rules.pro'
    }
}
"""

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ Release R8 configuration ready.")
          PY

      # ============================================================
      # 23. PREPARE GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "✅ Existing gradlew executable."
          else
            echo "⚠️ gradlew tidak ada."
            echo "Flutter akan membuat/mengelola Gradle invocation."
          fi

      # ============================================================
      # 24. FLUTTER PUB GET (SEBELUM BUILD)
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "RESOLVING FLUTTER DEPENDENCIES"
          echo "=============================================="

          flutter pub get

          echo "✅ Dependencies resolved."

      # ============================================================
      # 25. VERIFY DEPENDENCY REPOSITORIES
      # ============================================================

      - name: Verify Maven Repositories
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/android/settings.gradle"

          echo "=============================================="
          echo "MAVEN REPOSITORIES"
          echo "=============================================="

          grep -n "google()" "$SETTINGS" || true
          grep -n "mavenCentral()" "$SETTINGS" || true
          grep -n "gradlePluginPortal()" "$SETTINGS" || true

          if ! grep -q "google()" "$SETTINGS"; then
            echo "❌ google() repository missing."
            exit 1
          fi

          if ! grep -q "mavenCentral()" "$SETTINGS"; then
            echo "❌ mavenCentral() repository missing."
            exit 1
          fi

          echo "✅ Maven repositories verified."

      # ============================================================
      # 26. FLUTTER CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean || true

          rm -rf \
            android/.gradle \
            android/app/build \
            build \
            .dart_tool

          echo "✅ Flutter clean complete."

      # ============================================================
      # 27. BUILD APK
      # ============================================================

      - name: Build InterShare APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo ""
          echo "=============================================="
          echo "        INTERSHARE APK RELEASE BUILD"
          echo "=============================================="
          echo ""

          flutter build apk \
            --release \
            --no-tree-shake-icons

          echo ""
          echo "=============================================="
          echo "             BUILD SUCCESS"
          echo "=============================================="

      # ============================================================
      # 28. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK_PATH="$DEFAULT_APK"

          else

            APK_PATH="$(
              find "$PROJECT_DIR/build" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"

          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."

            echo ""
            echo "APK files:"
            find "$PROJECT_DIR/build" \
              -type f \
              -name "*.apk" \
              -print \
              2>/dev/null || true

            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_MB=$APK_MB" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="
          echo "Path: $APK_PATH"
          echo "Size: ${APK_MB} MB"

      # ============================================================
      # 29. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          file "$APK_PATH"

          if ! file "$APK_PATH" | grep -qi "zip\|android"; then
            echo "⚠️ File APK terdeteksi, tetapi tipe file tidak biasa."
          fi

          echo "✅ APK verified."

      # ============================================================
      # 30. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InterShare-release
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 31. TELEGRAM MESSAGE
      # ============================================================

      - name: Send Telegram Result
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${OWNER_ID:-}" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          MESSAGE="🎉 InterShare APK berhasil dibuat!

📱 InterShare
📦 com.intershare.marnommk
🔢 Version: 1.0.0+1
📏 Size: ${APK_MB} MB

✅ Release build berhasil."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo "✅ Telegram success message sent."

      # ============================================================
      # 32. SEND APK
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${OWNER_ID:-}" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 InterShare Release APK"

          echo "✅ APK sent to Telegram."

      # ============================================================
      # 33. FAILURE NOTIFICATION
      # ============================================================

      - name: Send Build Failure
        if: failure()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${OWNER_ID:-}" ]; then
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=❌ InterShare APK build gagal. Cek log GitHub Actions."

          echo "❌ Failure notification sent."
