name: InterShare - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter"
        required: true
        type: string

      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

jobs:
  build:
    name: Build InterShare APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.47.1"
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================

      - name: Verify Owner
        shell: bash
        env:
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -euo pipefail

          if [ -z "$OWNER_ID" ]; then
            echo "❌ OWNER_CHAT_ID belum diset."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi

          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized."
            exit 1
          fi

          echo "✅ Owner verified."

      # ============================================================
      # 2. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. TOOLS
      # ============================================================

      - name: Install Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            curl \
            file \
            python3

          echo "✅ Tools installed."

      # ============================================================
      # 7. ENVIRONMENT
      # ============================================================

      - name: Show Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INTERSHARE BUILD ENVIRONMENT"
          echo "=============================================="

          echo ""
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version || true

      # ============================================================
      # 8. DOWNLOAD ZIP
      # ============================================================

      - name: Download Project ZIP
        shell: bash
        env:
          ZIP_URL_INPUT: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail

          ZIP_URL="$ZIP_URL_INPUT"

          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi

          # GitHub blob -> raw
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi

          echo "📥 Downloading project ZIP..."
          echo "URL: $ZIP_URL"

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            --output project.zip

          if [ ! -s project.zip ]; then
            echo "❌ ZIP kosong."
            exit 1
          fi

          echo "✅ ZIP downloaded."

          ls -lh project.zip

          echo ""
          echo "ZIP file type:"
          file project.zip

      # ============================================================
      # 9. EXTRACT
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf flutter_project

          mkdir -p flutter_project

          unzip -q project.zip -d flutter_project

          echo "✅ ZIP extracted."

          echo ""
          echo "Extracted files:"
          find flutter_project -maxdepth 2 -type f | head -100

      # ============================================================
      # 10. FIND PUBSPEC
      # ============================================================

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(
            find "$GITHUB_WORKSPACE/flutter_project" \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              | head -n 1
          )"

          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "FLUTTER PROJECT DETECTED"
          echo "=============================================="
          echo "PUBSPEC:"
          echo "$PUBSPEC"
          echo ""
          echo "PROJECT:"
          echo "$PROJECT_DIR"
          echo "=============================================="

      # ============================================================
      # 11. CHECK ANDROID
      # ============================================================

      - name: Check Android Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "❌ Folder android tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" ]; then
            echo "❌ AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/settings.gradle" ]; then
            echo "❌ android/settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "✅ Android project detected."

      # ============================================================
      # 12. SHOW GRADLE CONFIG
      # ============================================================

      - name: Inspect Gradle Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ANDROID GRADLE CONFIGURATION"
          echo "=============================================="

          echo ""
          echo "----- settings.gradle -----"

          sed -n '1,240p' \
            "$PROJECT_DIR/android/settings.gradle" \
            || true

          echo ""
          echo "----- settings.gradle.kts -----"

          if [ -f "$PROJECT_DIR/android/settings.gradle.kts" ]; then
            sed -n '1,240p' \
              "$PROJECT_DIR/android/settings.gradle.kts"
          else
            echo "Not found."
          fi

          echo ""
          echo "----- build.gradle -----"

          if [ -f "$PROJECT_DIR/android/build.gradle" ]; then
            sed -n '1,260p' \
              "$PROJECT_DIR/android/build.gradle"
          else
            echo "Not found."
          fi

          echo ""
          echo "----- app/build.gradle -----"

          if [ -f "$PROJECT_DIR/android/app/build.gradle" ]; then
            sed -n '1,300p' \
              "$PROJECT_DIR/android/app/build.gradle"
          else
            echo "Not found."
          fi

          echo ""
          echo "=============================================="

      # ============================================================
      # 13. FIX FLUTTER ANDROID EMBEDDING
      # ============================================================

      - name: Fix Flutter Android Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          ANDROID = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID)

          try:
              tree = ET.parse(path)
          except Exception as e:
              print("❌ AndroidManifest.xml invalid:")
              print(e)
              sys.exit(1)

          root = tree.getroot()

          application = root.find("application")

          if application is None:
              print("❌ <application> tidak ditemukan.")
              sys.exit(1)

          found = False

          for child in application:
              if child.tag == "meta-data":

                  name = child.attrib.get(
                      f"{{{ANDROID}}}name"
                  )

                  if name == "flutterEmbedding":

                      child.set(
                          f"{{{ANDROID}}}value",
                          "2"
                      )

                      found = True

          if not found:

              metadata = ET.Element("meta-data")

              metadata.set(
                  f"{{{ANDROID}}}name",
                  "flutterEmbedding"
              )

              metadata.set(
                  f"{{{ANDROID}}}value",
                  "2"
              )

              application.insert(0, metadata)

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("✅ Flutter Android Embedding V2 configured.")
          PY

      # ============================================================
      # 14. VERIFY EMBEDDING
      # ============================================================

      - name: Verify Flutter Embedding
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android:name="flutterEmbedding"' "$MANIFEST"; then
            echo "❌ flutterEmbedding metadata tidak ditemukan."
            exit 1
          fi

          if ! grep -q 'android:value="2"' "$MANIFEST"; then
            echo "❌ Flutter Embedding V2 tidak aktif."
            exit 1
          fi

          echo "✅ Flutter Embedding V2 verified."

      # ============================================================
      # 15. FIX FLUTTER GRADLE REPOSITORY
      # ============================================================

      - name: Fix Flutter Gradle Repository
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/android/settings.gradle"

          if [ ! -f "$SETTINGS" ]; then
            echo "❌ settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "=============================================="
          echo "FIX FLUTTER GRADLE REPOSITORY"
          echo "=============================================="

          python3 - "$SETTINGS" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          old = "repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)"
          new = "repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)"

          if old in text:
              text = text.replace(old, new)
              path.write_text(text)
              print("✅ Changed PREFER_SETTINGS -> PREFER_PROJECT.")

          elif new in text:
              print("✅ PREFER_PROJECT already configured.")

          else:
              print("ℹ️ repositoriesMode not found.")
              print("No repository mode override was changed.")

          PY

          echo ""
          echo "----- Updated settings.gradle -----"

          sed -n '1,260p' "$SETTINGS"

          echo ""
          echo "=============================================="

      # ============================================================
      # 16. VERIFY FLUTTER GRADLE REPOSITORY
      # ============================================================

      - name: Verify Flutter Gradle Repository
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/android/settings.gradle"

          if grep -q \
            "repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)" \
            "$SETTINGS"; then

            echo "❌ PREFER_SETTINGS masih aktif."
            exit 1
          fi

          if grep -q \
            "repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)" \
            "$SETTINGS"; then

            echo "✅ PREFER_PROJECT verified."
          else
            echo "ℹ️ Tidak ada repositoriesMode override."
            echo "Flutter repository configuration akan digunakan."
          fi

      # ============================================================
      # 17. GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/android/gradlew" ]; then
            chmod +x "$PROJECT_DIR/android/gradlew"
            echo "✅ gradlew executable."
          else
            echo "❌ gradlew tidak ditemukan."
            exit 1
          fi

      # ============================================================
      # 18. VERIFY GRADLE CONFIGURATION
      # ============================================================

      - name: Verify Gradle Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "GRADLE CONFIGURATION"
          echo "=============================================="

          echo "Gradle configuration from ZIP is preserved."
          echo "AGP configuration from ZIP is preserved."
          echo "Kotlin configuration from ZIP is preserved."
          echo "Only Flutter repository compatibility is patched."

          echo ""

          echo "repositoriesMode:"
          grep -n \
            "repositoriesMode" \
            "$PROJECT_DIR/android/settings.gradle" \
            || true

          echo ""

          echo "Flutter Gradle plugin:"
          grep -n \
            "dev.flutter.flutter-gradle-plugin" \
            "$PROJECT_DIR/android/settings.gradle" \
            || true

      # ============================================================
      # 19. FLUTTER DOCTOR
      # ============================================================

      - name: Flutter Doctor
        shell: bash
        run: |
          set -euo pipefail

          flutter doctor -v || true

      # ============================================================
      # 20. FLUTTER CLEAN
      # ============================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

          echo "✅ Flutter clean complete."

      # ============================================================
      # 21. PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "RESOLVING FLUTTER DEPENDENCIES"
          echo "=============================================="

          flutter pub get

          echo "✅ Dependencies resolved."

      # ============================================================
      # 22. VERIFY FLUTTER GENERATED CONFIG
      # ============================================================

      - name: Verify Flutter Generated Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "FLUTTER GENERATED CONFIGURATION"
          echo "=============================================="

          if [ -f "$PROJECT_DIR/android/local.properties" ]; then
            echo ""
            echo "----- local.properties -----"

            sed \
              's#flutter.sdk=.*#flutter.sdk=***#' \
              "$PROJECT_DIR/android/local.properties" \
              || true
          fi

          if [ -f "$PROJECT_DIR/android/settings.gradle" ]; then
            echo ""
            echo "Flutter plugin loader:"
            grep -n \
              "flutter-plugin-loader" \
              "$PROJECT_DIR/android/settings.gradle" \
              || true

            echo ""
            echo "Flutter Gradle plugin:"
            grep -n \
              "flutter-gradle-plugin" \
              "$PROJECT_DIR/android/settings.gradle" \
              || true
          fi

      # ============================================================
      # 23. BUILD
      # ============================================================

      - name: Build InterShare APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo ""
          echo "=============================================="
          echo "        INTERSHARE APK RELEASE BUILD"
          echo "=============================================="
          echo ""

          flutter build apk \
            --release \
            --no-tree-shake-icons

          echo ""
          echo "=============================================="
          echo "             BUILD SUCCESS"
          echo "=============================================="

      # ============================================================
      # 24. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK_PATH="$DEFAULT_APK"

          else

            APK_PATH="$(
              find "$PROJECT_DIR/build" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"

          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_MB=$APK_MB" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="
          echo "Path: $APK_PATH"
          echo "Size: ${APK_MB} MB"

          echo ""
          echo "APK information:"
          file "$APK_PATH"

      # ============================================================
      # 25. ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InterShare-release
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 26. TELEGRAM MESSAGE
      # ============================================================

      - name: Send Telegram Result
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          MESSAGE="🎉 InterShare APK berhasil dibuat!

          📱 InterShare
          📦 com.intershare.marnommk
          🔢 Version: 1.0.0+1
          📏 Size: ${APK_MB} MB

          ✅ Release build berhasil."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo "✅ Telegram success message sent."

      # ============================================================
      # 27. SEND APK
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "⚠️ Telegram credentials tidak tersedia."
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 InterShare Release APK"

          echo "✅ APK sent to Telegram."

      # ============================================================
      # 28. FAILURE NOTIFICATION
      # ============================================================

      - name: Send Build Failure
        if: failure()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=❌ InterShare APK build gagal. Cek log GitHub Actions."

          echo "❌ Failure notification sent."
