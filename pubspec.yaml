name: pc_logo
description: PC Logo - Shizuku local config manager and diagnostic server.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shizuku_api: ^1.2.1
  dio: ^5.4.3+1
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  flutter_animate: ^4.5.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  android: true
  ios: false
  image_path: assets/icon.png
